// ==================== 调用关系项组件 ====================
const RelationItem = defineComponent({
  name: 'RelationItem',
  props: ['item', 'type', 'showRecursive'],
  emits: ['toggle'],
  setup(props, { emit }) {
    const hasChildren = computed(() => {
      return props.item.children && 
             (props.item.children.calls.length > 0 || props.item.children.called_by.length > 0);
    });

    const canExpand = computed(() => {
      return props.showRecursive && 
             props.item.depth < 5 && 
             (hasChildren.value || (!props.item.children && !props.item.loading));
    });

    const toggle = () => {
      if (canExpand.value) {
        emit('toggle', props.item, props.type);
      }
    };

    const getIndentStyle = () => {
      return {
        paddingLeft: `${props.item.depth * 20}px`
      };
    };

    const getFunctionName = () => {
      return props.type === 'calls' ? props.item.callee_name : props.item.caller_name;
    };

    const getFunctionFile = () => {
      return props.type === 'calls' ? props.item.callee_file : props.item.caller_file;
    };

    return {
      hasChildren,
      canExpand,
      toggle,
      getIndentStyle,
      getFunctionName,
      getFunctionFile
    };
  },
  template: `
    <div class="relation-item-container">
      <div class="relation-item" :style="getIndentStyle()">
        <div class="item-content">
          <button 
            v-if="canExpand" 
            @click="toggle"
            class="expand-btn"
            :class="{ 'expanded': item.expanded }"
          >
            <span v-if="item.loading">⏳</span>
            <span v-else-if="item.expanded">▼</span>
            <span v-else>▶</span>
          </button>
          <span v-else class="expand-spacer"></span>
          
          <div class="function-info">
            <span class="function-name">{{ getFunctionName() }}</span>
            <span class="function-file">{{ getFunctionFile() }}</span>
          </div>
          
          <div class="item-badges">
            <span v-if="hasChildren" class="children-badge">
              {{ item.children.calls.length + item.children.called_by.length }}
            </span>
          </div>
        </div>
      </div>

      <!-- 递归显示子级调用关系 -->
      <div v-if="item.expanded && item.children" class="children-container">
        <!-- 子级调用的函数 -->
        <div v-if="item.children.calls.length > 0" class="sub-relations">
          <div class="sub-header" :style="{ paddingLeft: (item.depth + 1) * 20 + 'px' }">
            📞 {{ getFunctionName() }} 调用的函数 ({{ item.children.calls.length }})
          </div>
          <relation-item
            v-for="subCall in item.children.calls"
            :key="'sub_call_' + subCall.id + '_' + subCall.depth"
            :item="subCall"
            :type="'calls'"
            :show-recursive="showRecursive"
            @toggle="$emit('toggle', $event, 'calls')"
          ></relation-item>
        </div>

        <!-- 子级被调用的函数 -->
        <div v-if="item.children.called_by.length > 0" class="sub-relations">
          <div class="sub-header" :style="{ paddingLeft: (item.depth + 1) * 20 + 'px' }">
            📞 调用 {{ getFunctionName() }} 的函数 ({{ item.children.called_by.length }})
          </div>
          <relation-item
            v-for="subCaller in item.children.called_by"
            :key="'sub_caller_' + subCaller.id + '_' + subCaller.depth"
            :item="subCaller"
            :type="'called_by'"
            :show-recursive="showRecursive"
            @toggle="$emit('toggle', $event, 'called_by')"
          ></relation-item>
        </div>
      </div>
    </div>
  `
});



// ==================== 调用关系面板组件 ====================
const CallGraphPanel = defineComponent({
  name: 'CallGraphPanel',
  components: {
    'relation-item': RelationItem
  },
  emits: ['function-selected', 'path-functions-changed', 'analysis-mode-changed'],
  setup(props, { emit }) {
    const callSearchTerm = ref('');
    const searchResults = ref([]);
    const selectedFunction = ref(null);
    const callRelations = ref({
      calls: [], // 该函数调用的其他函数
      called_by: [] // 调用该函数的其他函数
    });
    const loading = ref(false);
    const expandedItems = ref(new Set()); // 跟踪展开的函数
    const loadedRelations = ref(new Map()); // 缓存已加载的调用关系
    const maxDepth = ref(5); // 最大递归深度
    const showRecursive = ref(true); // 是否显示递归模式
    const viewMode = ref('graph'); // 显示模式：graph 或 tree
    const selectedNode = ref(null); // 选中的节点
    const network = ref(null); // vis.js网络实例
    const networkNodes = ref(null); // 网络节点数据
    const networkEdges = ref(null); // 网络边数据
    
    // 循环环检测相关变量
    const circularPaths = ref(new Set());
    const circularNodes = ref(new Set());
    
    // 路径分析相关状态
    const analysisMode = ref('calls'); // 'calls' | 'path'
    const sourceFunction = ref(null);
    const targetFunction = ref(null);
    const pathResults = ref([]);
    const pathStatistics = ref({});
    const isAnalyzing = ref(false);
    
    // 路径分析搜索状态
    const sourceSearchTerm = ref('');
    const sourceSearchResults = ref([]);
    const targetSearchTerm = ref('');
    const targetSearchResults = ref([]);
    
    // 确保vis.js已加载
    onMounted(() => {
      if (window.vis) {
        networkNodes.value = new window.vis.DataSet();
        networkEdges.value = new window.vis.DataSet();
      } else {
        console.error('vis.js未加载');
      }
    });

    // 计算属性：检查是否有循环调用
    const hasCircularCalls = computed(() => {
      return circularPaths.value.size > 0;
    });

    // 搜索函数
    const searchFunction = async () => {
      if (!callSearchTerm.value.trim()) {
        searchResults.value = [];
        return;
      }

      try {
        const response = await fetch(`/search_suggest?name=${encodeURIComponent(callSearchTerm.value)}`);
        const data = await response.json();
        searchResults.value = data.filter(item => item.type === 'function');
      } catch (error) {
        console.error('搜索函数失败:', error);
        searchResults.value = [];
      }
    };

    // 递归加载函数的调用关系（支持排除ID，避免在树中重复出现祖先/当前函数）
    const loadFunctionRelations = async (funcId, depth = 0, excludeIds = new Set()) => {
      try { console.log('[CallPanel] loadFunctionRelations:start', { funcId, depth, excludeIds: Array.from(excludeIds || []) }); } catch {}
      const dedupeById = (arr) => {
        const seen = new Set();
        const out = [];
        for (const it of arr) {
          if (!seen.has(it.id)) {
            seen.add(it.id);
            out.push(it);
          }
        }
        return out;
      };

      if (depth > maxDepth.value || loadedRelations.value.has(funcId)) {
        const cached = loadedRelations.value.get(funcId) || { calls: [], called_by: [] };
        let relations = { calls: [...cached.calls], called_by: [...cached.called_by] };
        try { console.log('[CallPanel] loadFunctionRelations:cache-hit', { funcId, depth, calls: relations.calls.map(x => x.id), called_by: relations.called_by.map(x => x.id) }); } catch {}
        if (excludeIds && excludeIds.size > 0) {
          relations.calls = relations.calls.filter(n => !excludeIds.has(n.id) && n.id !== funcId);
          relations.called_by = relations.called_by.filter(n => !excludeIds.has(n.id) && n.id !== funcId);
          try { console.log('[CallPanel] loadFunctionRelations:cache-filtered', { funcId, depth, excludeIds: Array.from(excludeIds), calls: relations.calls.map(x => x.id), called_by: relations.called_by.map(x => x.id) }); } catch {}
        }
        relations.calls = dedupeById(relations.calls);
        relations.called_by = dedupeById(relations.called_by);
        return relations;
      }

      try {
        // 调用真实的后端接口
        const response = await fetch(`/function_calls?function_id=${funcId}`);
        const data = await response.json();
        
        if (!data.error && data.function_info) {
          // 将后端数据格式转换为前端期望的格式
          let relations = {
            calls: (data.calls_made || []).map(call => ({
              id: call.callee_function_id,
              callee_name: call.callee_function.name,
              callee_file: call.callee_function.file_path,
              call_count: call.call_count || 1,
              call_sites: call.call_sites || [],
              // 使用第一个调用位置作为主要显示信息
              call_line: call.call_sites && call.call_sites.length > 0 ? call.call_sites[0].call_site_line_number : null,
              call_site_file: call.call_sites && call.call_sites.length > 0 ? call.call_sites[0].call_site_file_path : null,
              depth: depth + 1,
              expanded: false,
              loading: false,
              children: null
            })),
            called_by: (data.calls_received || []).map(caller => ({
              id: caller.caller_function_id,
              caller_name: caller.caller_function.name,
              caller_file: caller.caller_function.file_path,
              call_count: caller.call_count || 1,
              call_sites: caller.call_sites || [],
              // 使用第一个调用位置作为主要显示信息
              call_line: caller.call_sites && caller.call_sites.length > 0 ? caller.call_sites[0].call_site_line_number : null,
              call_site_file: caller.call_sites && caller.call_sites.length > 0 ? caller.call_sites[0].call_site_file_path : null,
              caller_id: caller.caller_function_id,
              depth: depth + 1,
              expanded: false,
              loading: false,
              children: null
            }))
          };
          try { console.log('[CallPanel] loadFunctionRelations:raw', { funcId, depth, calls: relations.calls.map(x => ({ id: x.id, name: x.callee_name })), called_by: relations.called_by.map(x => ({ id: x.id, name: x.caller_name })) }); } catch {}

          // 缓存原始（未过滤）结果
          const rawRelations = { calls: [...relations.calls], called_by: [...relations.called_by] };

          // 过滤：去除排除ID集合内的节点，避免当前函数或祖先函数再次出现
          if (excludeIds && excludeIds.size > 0) {
            relations.calls = relations.calls.filter(n => !excludeIds.has(n.id) && n.id !== funcId);
            relations.called_by = relations.called_by.filter(n => !excludeIds.has(n.id) && n.id !== funcId);
            try { console.log('[CallPanel] loadFunctionRelations:filtered', { funcId, depth, excludeIds: Array.from(excludeIds), calls: relations.calls.map(x => x.id), called_by: relations.called_by.map(x => x.id) }); } catch {}
          }

          // 去重：按id去重，避免重复条目
          relations.calls = dedupeById(relations.calls);
          relations.called_by = dedupeById(relations.called_by);
          try { console.log('[CallPanel] loadFunctionRelations:deduped', { funcId, depth, calls: relations.calls.map(x => x.id), called_by: relations.called_by.map(x => x.id) }); } catch {}
          
          // 缓存关系数据（缓存未附带ancestorIds/过滤状态的原始结果，供下次在不同排除集下复用）
          loadedRelations.value.set(funcId, rawRelations);
          
          return relations;
        }
      } catch (error) {
        console.error('获取调用关系失败:', error);
      }
      
      return { calls: [], called_by: [] };
    };

    // 展开/折叠函数调用关系
    const toggleExpand = async (item, type) => {
      const key = `${type}_${item.id}_${item.depth}`;
      try { console.log('[CallPanel] toggleExpand', { key, type, id: item.id, depth: item.depth, hasChildren: !!item.children }); } catch {}
      
      if (expandedItems.value.has(key)) {
        expandedItems.value.delete(key);
        item.expanded = false;
      } else {
        expandedItems.value.add(key);
        item.expanded = true;
        
        // 如果还没有加载子关系，则加载
        if (!item.children && item.depth < maxDepth.value) {
          item.loading = true;
          
          // 根据类型确定要查询的函数ID
          // 对于calls类型，查询被调用函数的调用关系；对于called_by类型，查询调用方函数的调用关系
          const funcId = item.id;
          const ancestorIds = Array.isArray(item.ancestorIds) ? item.ancestorIds : [];
          const excludeIds = new Set([funcId, ...ancestorIds]);
          try { console.log('[CallPanel] toggleExpand:load-children', { parentId: item.id, depth: item.depth, excludeIds: Array.from(excludeIds) }); } catch {}
          const children = await loadFunctionRelations(funcId, item.depth, excludeIds);
          // 继承祖先链，防止后续层级再次出现祖先/当前函数
          item.children = {
            calls: children.calls.map(c => ({ ...c, ancestorIds: [...ancestorIds, item.id] })),
            called_by: children.called_by.map(c => ({ ...c, ancestorIds: [...ancestorIds, item.id] }))
          };
          try { console.log('[CallPanel] toggleExpand:children-ready', { parentId: item.id, calls: item.children.calls.map(x => x.id), called_by: item.children.called_by.map(x => x.id) }); } catch {}
          item.loading = false;
        }
      }
    };

    // 选择函数并加载调用关系
    const selectFunction = async (func) => {
      try { console.log('[CallPanel] selectFunction', { raw: func }); } catch {}
      selectedFunction.value = func;
      searchResults.value = [];
      callSearchTerm.value = func.name;
      loading.value = true;
      
      // 发出函数选中事件
      emit('function-selected', {
        id: func.id,
        name: func.name,
        type: 'function'
      });
      
      // 清空之前的状态
      expandedItems.value.clear();
      loadedRelations.value.clear();

      try {
        // 从func.id中提取纯数字ID（去掉func_前缀）
        let funcId = func.id;
        if (typeof funcId === 'string' && funcId.startsWith('func_')) {
          funcId = parseInt(funcId.replace('func_', ''), 10);
        }
        
        console.log('选择函数:', func.name, '函数ID:', funcId);
        const relations = await loadFunctionRelations(funcId, 0, new Set([funcId]));
        // 过滤掉与根函数相同的项（防御性处理）
        const filteredCalls = (relations.calls || []).filter(c => c && c.id !== funcId);
        const filteredCalledBy = (relations.called_by || []).filter(c => c && c.id !== funcId);
        // 为顶层节点注入祖先链（仅包含根），避免展开时回到根函数
        callRelations.value = {
          calls: filteredCalls.map(c => ({ ...c, ancestorIds: [funcId] })),
          called_by: filteredCalledBy.map(c => ({ ...c, ancestorIds: [funcId] }))
        };
        try { console.log('[CallPanel] selectFunction:filtered-root', { funcId, calls: callRelations.value.calls.map(x => x.id), called_by: callRelations.value.called_by.map(x => x.id) }); } catch {}
        try { console.log('[CallPanel] selectFunction:relations-root', { funcId, calls: callRelations.value.calls.map(x => x.id), called_by: callRelations.value.called_by.map(x => x.id) }); } catch {}
        
        // 结束加载状态
        loading.value = false;
        
        // 如果是图形模式，更新网络图
        if (viewMode.value === 'graph') {
          await nextTick();
          // 延迟一段时间，确保loading状态更新和DOM渲染完成
          await new Promise(resolve => setTimeout(resolve, 100));
          await updateNetwork();
        }
      } catch (error) {
        console.error('获取调用关系失败:', error);
        callRelations.value = { calls: [], called_by: [] };
        clearNetwork(); // 确保清空网络图
        loading.value = false;
      }
    };

    // 清空选择
    const clearSelection = () => {
      selectedFunction.value = null;
      callRelations.value = { calls: [], called_by: [] };
      expandedItems.value.clear();
      loadedRelations.value.clear();
      callSearchTerm.value = '';
      selectedNode.value = null;
      clearNetwork();
      console.log('已清空选择');
    };

    // 调试开关与方法
    const GRAPH_DEBUG = false;
    const logDebug = (...args) => { if (GRAPH_DEBUG) console.log('[GraphDebug]', ...args); };

    // 初始化网络图
    const initNetwork = () => {
      let container;
      const tStart = performance.now();
      
      try {
        if (network.value) {
          network.value.destroy();
          network.value = null;
        }
        
        container = document.getElementById('call-graph-network');
        if (!container) {
          console.error('找不到网络图容器元素，当前视图模式:', viewMode.value);
          console.error('DOM中的网络容器元素:', document.querySelectorAll('[id*="network"]'));
          return;
        }
        
        if (container.offsetWidth === 0 || container.offsetHeight === 0) {
          console.error('容器元素尺寸为0，可能还未完全渲染');
          return;
        }
        
        console.log('找到容器元素:', container, '尺寸:', container.offsetWidth, 'x', container.offsetHeight);

        // 容器样式与命中检测
        const cs = getComputedStyle(container);
        logDebug('container styles:', {
          pointerEvents: cs.pointerEvents,
          overflow: cs.overflow,
          position: cs.position,
          zIndex: cs.zIndex
        });
        const rect = container.getBoundingClientRect();
        const centerEl = document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
        logDebug('elementFromPoint(center):', centerEl ? { tag: centerEl.tagName, id: centerEl.id, class: centerEl.className } : null);
        if (centerEl && centerEl !== container && !container.contains(centerEl)) {
          logDebug('WARNING: center element is not the network container or its child (可能被遮挡)');
        }

        // 捕获滚轮事件，确认是否被上层拦截
        const onWheelCapture = (e) => {
          logDebug('wheel event (capture):', { deltaY: e.deltaY, ctrlKey: e.ctrlKey, defaultPrevented: e.defaultPrevented });
        };
        container.addEventListener('wheel', onWheelCapture, { capture: true });
      } catch (error) {
        console.error('初始化网络图失败:', error);
        return;
      }

      const options = {
        nodes: {
          shape: 'box',
          margin: 10,
          font: {
            size: 14,
            color: '#ffffff'
          },
          borderWidth: 2,
          shadow: true
        },
        edges: {
          arrows: {
            to: { enabled: true, scaleFactor: 1.2 }
          },
          color: {
            color: '#848484',
            highlight: '#ff6b6b'
          },
          width: 2,
          smooth: {
            type: 'dynamic'
          }
        },
        layout: {
          hierarchical: {
            enabled: true,
            direction: 'UD',
            sortMethod: 'directed',
            nodeSpacing: 200,
            levelSeparation: 150
          }
        },
        physics: {
          enabled: true,
          hierarchicalRepulsion: {
            centralGravity: 0.1,
            springLength: 100,
            springConstant: 0.01,
            nodeDistance: 120,
            damping: 0.09
          },
          solver: 'hierarchicalRepulsion',
          stabilization: {
            enabled: true,
            iterations: 100
          }
        },
        interaction: {
          dragNodes: true,
          dragView: true,
          zoomView: true,
          selectConnectedEdges: false
        }
      };

      const data = {
        nodes: networkNodes.value,
        edges: networkEdges.value
      };

      console.log('初始化网络图数据:', {
        nodes: networkNodes.value ? networkNodes.value.length : 0,
        edges: networkEdges.value ? networkEdges.value.length : 0,
        hasVis: !!window.vis,
        containerExists: !!container
      });

      try {
        if (!container) {
          throw new Error('容器元素未定义');
        }
        
        if (!window.vis) {
          throw new Error('vis.js库未加载');
        }
        
        if (!networkNodes.value || !networkEdges.value) {
          throw new Error('网络数据未初始化');
        }
        
        const tCreateStart = performance.now();
        network.value = new window.vis.Network(container, data, options);
        const tCreated = performance.now();
        logDebug('Network created in ms:', Math.round(tCreated - tCreateStart));
        logDebug('Interaction options:', options.interaction);
        console.log('网络图创建成功');
        
        // 强制启动物理引擎和稳定化
        setTimeout(() => {
          if (network.value) {
            network.value.setOptions({ physics: { enabled: true } });
            network.value.stabilize();
            console.log('强制启动物理引擎和稳定化');
          }
        }, 50);

        // 绑定事件
        network.value.on('click', (params) => {
          try {
            if (params.nodes && params.nodes.length > 0) {
              const nodeId = params.nodes[0];
              const node = networkNodes.value.get(nodeId);
              if (node) {
                selectedNode.value = node;
              }
            } else {
              selectedNode.value = null;
            }
          } catch (error) {
            console.error('处理节点点击事件失败:', error);
          }
        });

        network.value.on('doubleClick', (params) => {
          try {
            if (params.nodes && params.nodes.length > 0) {
              const nodeId = params.nodes[0];
              const node = networkNodes.value.get(nodeId);
              if (node && node.expandable) {
                expandNodeInGraph(node);
              }
            }
          } catch (error) {
            console.error('处理节点双击事件失败:', error);
          }
        });

        // 调试：缩放、拖拽、稳定化等事件
        network.value.on('zoom', (params) => {
          logDebug('zoom event:', { scale: params.scale, direction: params.direction });
        });
        network.value.on('dragStart', () => logDebug('dragStart'));
        network.value.on('dragEnd', () => logDebug('dragEnd'));
        let lastProgressPct = -1;
        network.value.on('stabilizationProgress', (p) => {
          const pct = Math.floor((p.iterations / p.total) * 100);
          if (pct >= lastProgressPct + 10) {
            lastProgressPct = pct;
            logDebug('stabilizationProgress:', { pct, iterations: p.iterations, total: p.total });
          }
        });
        network.value.once('stabilized', () => {
          const tStab = performance.now();
          logDebug('stabilized in ms since initNetwork():', Math.round(tStab - tStart));
          try {
            if (window.performance && window.performance.memory) {
              const mem = window.performance.memory;
              logDebug('memory (approx):', { usedMB: Math.round(mem.usedJSHeapSize / 1048576), totalMB: Math.round(mem.totalJSHeapSize / 1048576) });
            }
          } catch {}
        });
      } catch (error) {
        console.error('创建网络图实例失败:', error);
      }
    };

    // 清空网络
    const clearNetwork = () => {
      try {
        if (network.value) {
          network.value.destroy();
          network.value = null;
        }
        if (window.vis) {
          networkNodes.value = new window.vis.DataSet();
          networkEdges.value = new window.vis.DataSet();
        }
      } catch (error) {
        console.error('清空网络失败:', error);
      }
    };

    // 构建网络数据
    const buildNetworkData = (relations, rootFunction) => {
      if (!relations || !rootFunction) return { nodes: [], edges: [], nodeMap: new Map() };
      try { console.log('[CallPanel] buildNetworkData:start', { rootFunction, calls: (relations.calls||[]).map(x=>x.id), called_by: (relations.called_by||[]).map(x=>x.id) }); } catch {}
      
      const nodes = [];
      const edges = [];
      const nodeMap = new Map();
      const existingNodeIds = new Set(); // 跟踪已添加的节点ID

      // 添加根节点（当前选中的函数）
      const rootId = `root_${rootFunction.id}`;
      const rootNumericId = (typeof rootFunction.id === 'string' && rootFunction.id.startsWith('func_'))
        ? parseInt(rootFunction.id.replace('func_', ''), 10)
        : rootFunction.id;
      if (!existingNodeIds.has(rootId)) {
        const rootNode = {
          id: rootId,
          label: rootFunction.name,
          color: {
            background: '#ff6b6b',
            border: '#cc5555'
          },
          font: { color: '#ffffff' },
          file_path: rootFunction.file_path || '',
          type: 'root',
          expandable: false,
          depth: 0
        };
        nodes.push(rootNode);
        nodeMap.set(rootId, rootNode);
        existingNodeIds.add(rootId);
        try { console.log('[CallPanel] buildNetworkData:add-root', { rootId, name: rootFunction.name }); } catch {}
      }

      // 添加调用的函数节点（按函数ID去重，忽略层级），并在添加前检查是否已有对应 func_<id> 或 root_<id>
      if (Array.isArray(relations.calls)) {
        relations.calls.forEach((call, index) => {
          if (!call || !call.id) return;
          
          const isRootTarget = (call.id === rootNumericId);
          const nodeId = isRootTarget ? rootId : `func_${call.id}`;
          const alreadyInNetwork = (networkNodes.value && !!networkNodes.value.get(nodeId));
          if (!existingNodeIds.has(nodeId) && !alreadyInNetwork) {
            const node = {
              id: nodeId,
              label: call.callee_name || '未知函数',
              color: {
                background: '#bfdbfe',
                border: '#60a5fa'
              },
              font: { color: '#1f2937' },
              file_path: call.callee_file || '',
              depth: call.depth || 1,
              type: 'calls',
              expandable: (call.depth || 1) < maxDepth.value,
              originalData: call
            };
            if (!isRootTarget) {
              nodes.push(node);
              nodeMap.set(nodeId, node);
              existingNodeIds.add(nodeId);
              try { console.log('[CallPanel] buildNetworkData:add-node(call)', { nodeId, id: call.id, name: call.callee_name }); } catch {}
            } else {
              try { console.log('[CallPanel] buildNetworkData:skip-add-node(call-is-root)', { nodeId, id: call.id }); } catch {}
            }
          }
          else { try { console.log('[CallPanel] buildNetworkData:reuse-node(call)', { nodeId, id: call.id }); } catch {} }

          // 添加边（允许多条边指向同一节点）
          const edgeId = `edge_call_${rootId}_${nodeId}_${index}`;
          const edgeLabel = '';
          edges.push({
            id: edgeId,
            from: rootId,
            to: nodeId,
            color: { color: '#60a5fa' },
            label: edgeLabel
          });
          try { console.log('[CallPanel] buildNetworkData:add-edge(call)', { edgeId, from: rootId, to: nodeId }); } catch {}
        });
      }

      // 添加被调用的函数节点（按函数ID去重，忽略层级），并在添加前检查是否已有对应 func_<id> 或 root_<id>
      if (Array.isArray(relations.called_by)) {
        relations.called_by.forEach((caller, index) => {
          if (!caller || !caller.id) return;
          
          const isRootSource = (caller.id === rootNumericId);
          const nodeId = isRootSource ? rootId : `func_${caller.id}`;
          const alreadyInNetwork = (networkNodes.value && !!networkNodes.value.get(nodeId));
          if (!existingNodeIds.has(nodeId) && !alreadyInNetwork) {
            const node = {
              id: nodeId,
              label: caller.caller_name || '未知函数',
              color: {
                background: '#bfdbfe',
                border: '#60a5fa'
              },
              font: { color: '#1f2937' },
              file_path: caller.caller_file || '',
              depth: caller.depth || 1,
              type: 'called_by',
              expandable: (caller.depth || 1) < maxDepth.value,
              originalData: caller
            };
            if (!isRootSource) {
              nodes.push(node);
              nodeMap.set(nodeId, node);
              existingNodeIds.add(nodeId);
              try { console.log('[CallPanel] buildNetworkData:add-node(caller)', { nodeId, id: caller.id, name: caller.caller_name }); } catch {}
            } else {
              try { console.log('[CallPanel] buildNetworkData:skip-add-node(caller-is-root)', { nodeId, id: caller.id }); } catch {}
            }
          }
          else { try { console.log('[CallPanel] buildNetworkData:reuse-node(caller)', { nodeId, id: caller.id }); } catch {} }

          // 添加边
          const edgeId = `edge_caller_${nodeId}_${rootId}_${index}`;
          const edgeLabel = '';
          edges.push({
            id: edgeId,
            from: nodeId,
            to: rootId,
            color: { color: '#60a5fa' },
            label: edgeLabel
          });
          try { console.log('[CallPanel] buildNetworkData:add-edge(caller)', { edgeId, from: nodeId, to: rootId }); } catch {}
        });
      }

      return { nodes, edges, nodeMap };
    };

    // 更新网络图
    const updateNetwork = async () => {
      try {
        if (viewMode.value !== 'graph' || !selectedFunction.value) return;

        clearNetwork();
        
        // 等待多个nextTick确保DOM完全渲染
        await nextTick();
        await nextTick();
        await nextTick();
        
        // 改进的容器等待逻辑
        const waitForContainer = async () => {
          let retryCount = 0;
          const maxRetries = 30;
          
          while (retryCount < maxRetries) {
            const container = document.getElementById('call-graph-network');
            if (container && container.offsetWidth > 0 && container.offsetHeight > 0) {
              console.log('找到网络图容器，尺寸:', container.offsetWidth, 'x', container.offsetHeight);
              return container;
            }
            retryCount++;
            console.log(`等待容器元素渲染... 尝试 ${retryCount}/${maxRetries}`);
            await new Promise(resolve => setTimeout(resolve, 100));
          }
          throw new Error('容器元素渲染超时');
        };
        
        try {
          await waitForContainer();
        } catch (error) {
          console.error('等待容器失败:', error);
          return;
        }
        
        const { nodes, edges } = buildNetworkData(callRelations.value, selectedFunction.value);
        // 输出所有节点与边，便于确认同名节点的具体ID与路径
        try {
          console.log('构建网络数据(完整):', {
            nodesCount: nodes.length,
            edgesCount: edges.length,
            nodes: nodes.map(n => ({ id: n.id, label: n.label, file_path: n.file_path, type: n.type })),
            edges: edges.map(e => ({ id: e.id, from: e.from, to: e.to }))
          });
        } catch {}
        
        if (nodes.length > 0) {
          networkNodes.value = new window.vis.DataSet(nodes);
        } else {
          networkNodes.value = new window.vis.DataSet();
        }
        
        if (edges.length > 0) {
          networkEdges.value = new window.vis.DataSet(edges);
        } else {
          networkEdges.value = new window.vis.DataSet();
        }
        
        await nextTick();
        initNetwork();
      } catch (error) {
        console.error('更新网络图失败:', error);
      }
    };

    // 在图中展开节点
    const expandNodeInGraph = async (node) => {
      try {
        if (!node || !node.expandable) return;

        // 兼容：优先使用 originalData.id，否则从节点ID解析
        let funcId = node.originalData && node.originalData.id;
        if (!funcId) {
          try {
            const parts = String(node.id).split('_');
            // 形如 call_123_2 或 caller_456_1
            if (parts.length >= 3) {
              funcId = parseInt(parts[1], 10);
            }
          } catch {}
        }
        if (!funcId) return;

        const newRelations = await loadFunctionRelations(funcId, node.depth || 1);
        if (!newRelations) return;
        
        // 添加新的子节点
        const newNodes = [];
        const newEdges = [];
        const existingNodeIds = new Set(); // 跟踪已添加的节点ID
        
        // 获取根函数ID，用于去重检查
        const rootFuncId = selectedFunction.value ? 
          (typeof selectedFunction.value.id === 'string' && selectedFunction.value.id.startsWith('func_') 
            ? parseInt(selectedFunction.value.id.replace('func_', ''), 10) 
            : selectedFunction.value.id) : null;
        
        // 辅助函数：检查函数ID是否已存在于图中
        const isFunctionIdAlreadyInGraph = (funcId) => {
          if (rootFuncId && funcId === rootFuncId) return true;
          
          return networkNodes.value.get().some(n => {
            if (n.originalData && n.originalData.id === funcId) return true;
            // 检查节点ID中是否包含相同的函数ID
            const nodeIdParts = String(n.id).split('_');
            if (nodeIdParts.length >= 2) {
              const nodeFuncId = parseInt(nodeIdParts[1], 10);
              return nodeFuncId === funcId;
            }
            return false;
          });
        };

        // 辅助函数：检查是否形成循环调用
        const checkCircularCall = (fromNodeId, toNodeId) => {
          // 提取函数ID（去掉前缀和深度信息）
          const extractFuncId = (nodeId) => {
            const parts = String(nodeId).split('_');
            if (parts.length >= 2) {
              return parseInt(parts[1], 10);
            }
            return null;
          };

          const fromFuncId = extractFuncId(fromNodeId);
          const toFuncId = extractFuncId(toNodeId);

          // 如果两个节点代表同一个函数，则形成循环调用
          if (fromFuncId && toFuncId && fromFuncId === toFuncId) {
            return true;
          }

          // 检查是否形成更复杂的循环（通过路径检测）
          return detectCircularPath(fromNodeId, toNodeId);
        };



        // 使用Tarjan算法找强连通分量（循环）
        const detectCyclesInGraph = () => {
          const nodes = networkNodes.value.get();
          const edges = networkEdges.value.get();
          
          // 不清空之前的循环标记，而是累积标记
          // circularNodes.value.clear();  // ❌ 移除这行
          // circularPaths.value.clear();  // ❌ 移除这行
          
          // 构建邻接表
          const adjacencyList = new Map();
          nodes.forEach(node => {
            adjacencyList.set(node.id, []);
          });
          
          edges.forEach(edge => {
            if (adjacencyList.has(edge.from)) {
              adjacencyList.get(edge.from).push(edge.to);
            }
          });
          
          // Tarjan算法找强连通分量
          let index = 0;
          const stack = [];
          const indices = new Map();
          const lowLinks = new Map();
          const onStack = new Set();
          const sccs = []; // 强连通分量列表
          
          const strongConnect = (nodeId) => {
            // 设置深度优先搜索的索引
            indices.set(nodeId, index);
            lowLinks.set(nodeId, index);
            index++;
            stack.push(nodeId);
            onStack.add(nodeId);
            
            // 考虑所有邻居
            const neighbors = adjacencyList.get(nodeId) || [];
            for (const neighborId of neighbors) {
              if (!indices.has(neighborId)) {
                // 邻居还没有被访问，递归访问
                strongConnect(neighborId);
                lowLinks.set(nodeId, Math.min(lowLinks.get(nodeId), lowLinks.get(neighborId)));
              } else if (onStack.has(neighborId)) {
                // 邻居在栈中，更新lowLink
                lowLinks.set(nodeId, Math.min(lowLinks.get(nodeId), indices.get(neighborId)));
              }
            }
            
            // 如果nodeId是强连通分量的根，弹出栈中所有节点
            if (lowLinks.get(nodeId) === indices.get(nodeId)) {
              const scc = [];
              let neighborId;
              do {
                neighborId = stack.pop();
                onStack.delete(neighborId);
                scc.push(neighborId);
              } while (neighborId !== nodeId);
              
              // 只保留大小大于1的强连通分量（真正的循环）
              if (scc.length > 1) {
                sccs.push(scc);
                console.log('找到循环:', scc);
              }
            }
          };
          
          // 对每个未访问的节点运行Tarjan算法
          nodes.forEach(node => {
            if (!indices.has(node.id)) {
              strongConnect(node.id);
            }
          });
          
          // 标记所有循环中的节点和边
          sccs.forEach(scc => {
            console.log('处理强连通分量:', scc);
            
            // 标记节点
            scc.forEach(nodeId => {
              circularNodes.value.add(nodeId);
              console.log('添加循环节点:', nodeId);
            });
            
            // 标记边
            scc.forEach(nodeId => {
              const neighbors = adjacencyList.get(nodeId) || [];
              neighbors.forEach(neighborId => {
                if (scc.includes(neighborId)) {
                  // 这条边在循环内部
                  const edgeKey = `${nodeId}->${neighborId}`;
                  circularPaths.value.add(edgeKey);
                  console.log('添加循环边:', edgeKey);
                }
              });
            });
          });
          
          console.log('最终检测到的循环节点:', Array.from(circularNodes.value));
          console.log('最终检测到的循环边:', Array.from(circularPaths.value));
        };

        // 辅助函数：检查节点是否在循环环中
        const isNodeInCircularPath = (nodeId) => {
          // 直接检查节点ID
          if (circularNodes.value.has(nodeId)) {
            return true;
          }
          
          // 检查函数ID（从节点ID中提取）
          const nodeIdParts = String(nodeId).split('_');
          if (nodeIdParts.length >= 2) {
            const funcId = parseInt(nodeIdParts[1], 10);
            const funcKey = `func_${funcId}`;
            if (circularNodes.value.has(funcKey)) {
              return true;
            }
          }
          
          // 检查root_func格式
          if (nodeId.startsWith('root_func_')) {
            const funcId = nodeId.replace('root_func_', '');
            const funcKey = `func_${funcId}`;
            if (circularNodes.value.has(funcKey)) {
              return true;
            }
          }
          
          return false;
        };

        // 辅助函数：检查边是否在循环环中
        const isEdgeInCircularPath = (fromNodeId, toNodeId) => {
          // 直接检查边
          const edgeKey = `${fromNodeId}->${toNodeId}`;
          if (circularPaths.value.has(edgeKey)) {
            return true;
          }
          
          // 检查函数ID格式的边
          const extractFuncId = (nodeId) => {
            if (nodeId.startsWith('func_')) {
              return nodeId;
            }
            if (nodeId.startsWith('root_func_')) {
              return `func_${nodeId.replace('root_func_', '')}`;
            }
            const nodeIdParts = String(nodeId).split('_');
            if (nodeIdParts.length >= 2) {
              const funcId = parseInt(nodeIdParts[1], 10);
              return `func_${funcId}`;
            }
            return null;
          };
          
          const fromFuncId = extractFuncId(fromNodeId);
          const toFuncId = extractFuncId(toNodeId);
          
          if (fromFuncId && toFuncId) {
            const funcEdgeKey = `${fromFuncId}->${toFuncId}`;
            if (circularPaths.value.has(funcEdgeKey)) {
              return true;
            }
          }
          
          return false;
        };

        // 只更新循环边样式的函数
        const updateCircularEdgeStyles = () => {
          console.log('开始更新循环边样式...');
          console.log('循环边集合:', Array.from(circularPaths.value));
          
          // 只更新循环边的样式
          const allEdges = networkEdges.value.get();
          allEdges.forEach(existingEdge => {
            if (isEdgeInCircularPath(existingEdge.from, existingEdge.to)) {
              const updatedEdge = {
                ...existingEdge,
                color: {
                  color: '#ef4444',  // 红色
                  width: 3           // 加粗
                },
                // label: `⚠️ ${existingEdge.label.replace('⚠️ ', '').replace(' [循环!]', '')} [循环!]`,
                font: {
                  color: '#dc2626',  // 红色字体
                  size: 14,
                  face: 'bold'
                },
                dashes: [5, 5],      // 虚线
                title: '⚠️ 检测到循环调用！这可能导致无限递归或栈溢出。'
              };
              networkEdges.value.update(updatedEdge);
              console.log('✅ 更新循环边:', existingEdge.from, '->', existingEdge.to, '样式: 红色虚线');
            }
          });
          
          console.log('循环边样式更新完成！');
        };

        // 辅助函数：检测循环路径
        const detectCircularPath = (startNodeId, targetNodeId) => {
          const visited = new Set();
          const path = [];
          
          const dfs = (currentNodeId, depth = 0) => {
            if (depth > 10) return false; // 防止无限递归
            if (visited.has(currentNodeId)) return false;
            
            visited.add(currentNodeId);
            path.push(currentNodeId);
            
            // 如果找到目标节点，检查是否形成循环
            if (currentNodeId === targetNodeId && path.length > 1) {
              return true;
            }
            
            // 获取当前节点的所有出边
            const edges = networkEdges.value.get();
            const outgoingEdges = edges.filter(edge => edge.from === currentNodeId);
            
            for (const edge of outgoingEdges) {
              if (dfs(edge.to, depth + 1)) {
                return true;
              }
            }
            
            path.pop();
            return false;
          };
          
          return dfs(startNodeId);
        };

        // 添加该节点调用的函数
        if (Array.isArray(newRelations.calls)) {
          newRelations.calls.forEach(call => {
            if (!call || !call.id) return;
            
            let nodeId = `call_${call.id}_${call.depth || 1}`;
            let shouldCreateNode = false;
            
            // 去重检查：使用辅助函数检查是否已存在
            if (isFunctionIdAlreadyInGraph(call.id)) {
              console.log('跳过重复的函数节点:', call.id, call.callee_name);
              // 找到已存在的节点ID，用于创建边
              const existingNode = networkNodes.value.get().find(n => {
                if (n.originalData && n.originalData.id === call.id) return true;
                const nodeIdParts = String(n.id).split('_');
                if (nodeIdParts.length >= 2) {
                  const nodeFuncId = parseInt(nodeIdParts[1], 10);
                  return nodeFuncId === call.id;
                }
                return false;
              });
              if (existingNode) {
                nodeId = existingNode.id;
              }
            } else {
                          // 创建新节点
            if (!networkNodes.value.get(nodeId) && !existingNodeIds.has(nodeId)) {
              const newNode = {
                id: nodeId,
                label: call.callee_name || '未知函数',
                color: {
                  background: '#bfdbfe',  // 保持原来的背景色
                  border: '#60a5fa'       // 保持原来的边框色
                },
                font: { 
                  color: '#1f2937',  // 保持原来的字体颜色
                  size: 14,
                  face: 'normal'
                },
                file_path: call.callee_file || '',
                call_line: call.call_line,
                depth: call.depth || 1,
                type: 'calls',
                expandable: (call.depth || 1) < maxDepth.value,
                originalData: call
              };
              newNodes.push(newNode);
              existingNodeIds.add(nodeId);
              shouldCreateNode = true;
            }
            }

            // 总是添加边，无论节点是否重复
            const edgeLabel = call.call_count > 1 ? `调用${call.call_count}次` : 
                            (call.call_line ? `行${call.call_line}` : '调用1次');
            const edgeId = `edge_call_${call.id}_${call.depth || 1}_${Date.now()}`; // 添加时间戳确保边ID唯一
            
            // 检查是否形成循环调用
            const isCircularCall = isEdgeInCircularPath(node.id, nodeId) || checkCircularCall(node.id, nodeId);
            
            newEdges.push({
              id: edgeId,
              from: node.id,
              to: nodeId,
              color: { 
                color: isCircularCall ? '#ef4444' : '#60a5fa',  // 红色表示循环调用
                width: isCircularCall ? 3 : 1  // 循环调用边加粗
              },
              // label: isCircularCall ? `⚠️ ${edgeLabel} [循环!]` : edgeLabel,
              font: {
                color: isCircularCall ? '#dc2626' : '#1f2937',
                size: isCircularCall ? 14 : 12,
                face: isCircularCall ? 'bold' : 'normal'
              },
              dashes: isCircularCall ? [5, 5] : false,  // 循环调用边使用虚线
              title: isCircularCall ? '⚠️ 检测到循环调用！这可能导致无限递归或栈溢出。' : edgeLabel
            });
          });
        }

        // 添加调用该节点的函数
        if (Array.isArray(newRelations.called_by)) {
          newRelations.called_by.forEach(caller => {
            if (!caller || !caller.id) return;
            
            let nodeId = `caller_${caller.id}_${caller.depth || 1}`;
            let shouldCreateNode = false;
            
            // 去重检查：使用辅助函数检查是否已存在
            if (isFunctionIdAlreadyInGraph(caller.id)) {
              console.log('跳过重复的函数节点:', caller.id, caller.caller_name);
              // 找到已存在的节点ID，用于创建边
              const existingNode = networkNodes.value.get().find(n => {
                if (n.originalData && n.originalData.id === caller.id) return true;
                const nodeIdParts = String(n.id).split('_');
                if (nodeIdParts.length >= 2) {
                  const nodeFuncId = parseInt(nodeIdParts[1], 10);
                  return nodeFuncId === caller.id;
                }
                return false;
              });
              if (existingNode) {
                nodeId = existingNode.id;
              }
            } else {
                          // 创建新节点
            if (!networkNodes.value.get(nodeId) && !existingNodeIds.has(nodeId)) {
              const newNode = {
                id: nodeId,
                label: caller.caller_name || '未知函数',
                color: {
                  background: '#bfdbfe',  // 保持原来的背景色
                  border: '#60a5fa'       // 保持原来的边框色
                },
                font: { 
                  color: '#1f2937',  // 保持原来的字体颜色
                  size: 14,
                  face: 'normal'
                },
                file_path: caller.caller_file || '',
                call_line: caller.call_line,
                depth: caller.depth || 1,
                type: 'called_by',
                expandable: (caller.depth || 1) < maxDepth.value,
                originalData: caller
              };
              newNodes.push(newNode);
              existingNodeIds.add(nodeId);
              shouldCreateNode = true;
            }
            }

            // 总是添加边，无论节点是否重复
            const edgeLabel = caller.call_count > 1 ? `调用${caller.call_count}次` : 
                            (caller.call_line ? `行${caller.call_line}` : '调用1次');
            const edgeId = `edge_caller_${caller.id}_${caller.depth || 1}_${Date.now()}`; // 添加时间戳确保边ID唯一
            
            // 检查是否形成循环调用
            const isCircularCall = isEdgeInCircularPath(nodeId, node.id) || checkCircularCall(nodeId, node.id);
            
            newEdges.push({
              id: edgeId,
              from: nodeId,
              to: node.id,
              color: { 
                color: isCircularCall ? '#ef4444' : '#60a5fa',  // 红色表示循环调用
                width: isCircularCall ? 3 : 1  // 循环调用边加粗
              },
              // label: isCircularCall ? `⚠️ ${edgeLabel} [循环!]` : edgeLabel,
              font: {
                color: isCircularCall ? '#dc2626' : '#1f2937',
                size: isCircularCall ? 14 : 12,
                face: isCircularCall ? 'bold' : 'normal'
              },
              dashes: isCircularCall ? [5, 5] : false,  // 循环调用边使用虚线
              title: isCircularCall ? '⚠️ 检测到循环调用！这可能导致无限递归或栈溢出。' : edgeLabel
            });
          });
        }

        // 批量添加新节点和边
        if (newNodes.length > 0) {
          try {
            networkNodes.value.add(newNodes);
            if (newEdges.length > 0) {
              networkEdges.value.add(newEdges);
            }
            
            // 检测并标记循环环
            if (newEdges.length > 0) {
              // 第一阶段：检测所有循环
              detectCyclesInGraph();
              
              // 第二阶段：只更新循环边的样式
              updateCircularEdgeStyles();
            }
            
            // 标记节点已展开
            const updatedNode = {
              ...node,
              expanded: true,
              expandable: false
            };
            networkNodes.value.update(updatedNode);
            // 稳定并适配视图，便于看到新增内容
            if (network.value) {
              network.value.stabilize(100);
              network.value.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' }, padding: 80 });
            }
          } catch (error) {
            console.error('添加新节点和边失败:', error);
          }
        }
      } catch (error) {
        console.error('展开节点失败:', error);
      }
    };

    // 根据深度获取颜色
    const getDepthColor = (depth, type) => {
      const colors = {
        calls: ['#4ecdc4', '#26c6da', '#00acc1', '#0097a7', '#00838f'],
        called_by: ['#ffa726', '#ff7043', '#f4511e', '#e64a19', '#d84315']
      };
      const colorArray = colors[type] || colors.calls;
      return colorArray[Math.min(depth - 1, colorArray.length - 1)] || colorArray[colorArray.length - 1];
    };

    // 根据深度获取边框颜色
    const getDepthBorderColor = (depth, type) => {
      const colors = {
        calls: ['#3da6a0', '#1e9ba3', '#00838f', '#006064', '#004d40'],
        called_by: ['#ff8f00', '#e64a19', '#d84315', '#bf360c', '#a52714']
      };
      const colorArray = colors[type] || colors.calls;
      return colorArray[Math.min(depth - 1, colorArray.length - 1)] || colorArray[colorArray.length - 1];
    };

    // 图形控制函数
    const resetGraphView = () => {
      if (network.value) {
        network.value.fit();
      }
    };

    const fitGraphToWindow = () => {
      if (network.value) {
        network.value.fit({
          animation: {
            duration: 1000,
            easingFunction: 'easeInOutQuad'
          }
        });
      }
    };

    const expandAllNodes = async () => {
      const expandableNodes = networkNodes.value.get().filter(node => node.expandable);
      for (const node of expandableNodes) {
        await expandNodeInGraph(node);
      }
    };

    const collapseAllNodes = () => {
      // 移除所有非根节点和非第一层节点
      const allNodes = networkNodes.value.get();
      const allEdges = networkEdges.value.get();
      
      const nodesToRemove = allNodes.filter(node => 
        node.type !== 'root' && node.depth > 1
      ).map(node => node.id);
      
      const edgesToRemove = allEdges.filter(edge => 
        nodesToRemove.includes(edge.from) || nodesToRemove.includes(edge.to)
      ).map(edge => edge.id);
      
      networkNodes.value.remove(nodesToRemove);
      networkEdges.value.remove(edgesToRemove);
      
      // 重置第一层节点的展开状态
      const firstLevelNodes = allNodes.filter(node => node.depth === 1);
      firstLevelNodes.forEach(node => {
        node.expanded = false;
        node.expandable = node.depth < maxDepth.value;
      });
      networkNodes.value.update(firstLevelNodes);
    };

    const focusOnNode = (node) => {
      if (network.value) {
        network.value.focus(node.id, {
          animation: {
            duration: 1000,
            easingFunction: 'easeInOutQuad'
          },
          scale: 1.5
        });
      }
    };

    // 路径分析相关方法
    const searchSourceFunction = async () => {
      if (!sourceSearchTerm.value.trim()) {
        sourceSearchResults.value = [];
        return;
      }
      
      try {
        const response = await fetch(`/search_suggest?name=${encodeURIComponent(sourceSearchTerm.value)}`);
        const data = await response.json();
        sourceSearchResults.value = data.filter(item => item.type === 'function');
      } catch (error) {
        console.error('搜索源函数失败:', error);
        sourceSearchResults.value = [];
      }
    };
    
    const searchTargetFunction = async () => {
      if (!targetSearchTerm.value.trim()) {
        targetSearchResults.value = [];
        return;
      }
      
      try {
        const response = await fetch(`/search_suggest?name=${encodeURIComponent(targetSearchTerm.value)}`);
        const data = await response.json();
        targetSearchResults.value = data.filter(item => item.type === 'function');
      } catch (error) {
        console.error('搜索目标函数失败:', error);
        targetSearchResults.value = [];
      }
    };
    
    const selectPathFunction = (func, target) => {
      if (target === 'source') {
        sourceFunction.value = func;
        sourceSearchResults.value = [];
        sourceSearchTerm.value = '';
      } else if (target === 'target') {
        targetFunction.value = func;
        targetSearchResults.value = [];
        targetSearchTerm.value = '';
      }
      // 通知父级源/目标函数变化
      emit('path-functions-changed', {
        source: sourceFunction.value,
        target: targetFunction.value
      });
    };
    
    const analyzePath = async () => {
      if (!sourceFunction.value || !targetFunction.value) {
        alert('请选择源函数和目标函数');
        return;
      }
      
      isAnalyzing.value = true;
      
      try {
        const sourceId = sourceFunction.value.id.replace('func_', '');
        const targetId = targetFunction.value.id.replace('func_', '');
        
        const response = await fetch(`/api/path_analysis?source_id=${sourceId}&target_id=${targetId}`);
        const data = await response.json();
        
        if (data.error) {
          alert(`路径分析失败: ${data.message}`);
          return;
        }
        
        pathResults.value = data.paths || [];
        pathStatistics.value = data.complexity_metrics || {};
        
        console.log('路径分析结果:', data);
      } catch (error) {
        console.error('路径分析失败:', error);
        alert('路径分析失败，请检查网络连接');
      } finally {
        isAnalyzing.value = false;
      }
    };
    
    const clearPathResults = () => {
      pathResults.value = [];
      pathStatistics.value = {};
      sourceFunction.value = null;
      targetFunction.value = null;
      emit('path-functions-changed', { source: null, target: null });
    };
    
    const clearPathFunction = (target) => {
      if (target === 'source') {
        sourceFunction.value = null;
      } else if (target === 'target') {
        targetFunction.value = null;
      }
      emit('path-functions-changed', {
        source: sourceFunction.value,
        target: targetFunction.value
      });
    };

    // 监听视图模式变化
    watch(viewMode, async (newMode) => {
      try {
        if (newMode === 'graph' && selectedFunction.value) {
          // 等待更长时间确保DOM完全渲染
          await nextTick();
          await new Promise(resolve => setTimeout(resolve, 100));
          await updateNetwork();
        } else if (newMode === 'tree') {
          clearNetwork();
        }
      } catch (error) {
        console.error('切换视图模式失败:', error);
      }
    });

    // 监听分析模式变化并通知父级
    watch(analysisMode, (mode) => {
      emit('analysis-mode-changed', mode);
    }, { immediate: true });

    return {
      callSearchTerm,
      searchResults,
      selectedFunction,
      callRelations,
      loading,
      expandedItems,
      maxDepth,
      showRecursive,
      viewMode,
      selectedNode,
      network,
      networkNodes,
      networkEdges,
      hasCircularCalls,
      circularPaths,
      circularNodes,
      searchFunction,
      selectFunction,
      toggleExpand,
      clearSelection,
      initNetwork,
      clearNetwork,
      updateNetwork,
      expandNodeInGraph,
      resetGraphView,
      fitGraphToWindow,
      expandAllNodes,
      collapseAllNodes,
      focusOnNode,
      // 路径分析相关
      analysisMode,
      sourceFunction,
      targetFunction,
      pathResults,
      pathStatistics,
      isAnalyzing,
      sourceSearchTerm,
      sourceSearchResults,
      targetSearchTerm,
      targetSearchResults,
      searchSourceFunction,
      searchTargetFunction,
      selectPathFunction,
      analyzePath,
      clearPathResults,
      clearPathFunction
    };
  },

            <div v-show="loading" class="loading-network">
              <div class="bouncing-ball"></div>
              正在初始化网络图...
            </div>
            
            <!-- 图例（仅标出当前函数） -->
            <div class="graph-legend">
              <div class="legend-item">
                <div class="legend-node root"></div>
                <span>当前函数</span>
              </div>
            </div>
            
            <!-- 节点信息面板 -->
            <div v-if="selectedNode" class="node-info-panel">

            </div>

        </div>

        <!-- 树形列表视图 -->

          <div class="relation-card">

              <span class="icon">📞</span>

            </h4>
            <div v-if="!callRelations.calls || callRelations.calls.length === 0" class="empty-state">
              该函数没有调用其他函数
            </div>
            <div v-else class="relation-tree">
              <div v-for="call in callRelations.calls" :key="'call_' + call.id" class="tree-item">
                <relation-item 
                  :item="call"
                  :type="'calls'"
                  :show-recursive="showRecursive"
                  @toggle="toggleExpand"
                ></relation-item>
              </div>
            </div>
          </div>

          <!-- 调用该函数的其他函数 -->
          <div class="relation-card">
            <h4>
              <span class="icon">📞</span>

            <div v-if="!callRelations.called_by || callRelations.called_by.length === 0" class="empty-state">
              没有函数调用该函数
            </div>

              <div v-for="caller in callRelations.called_by" :key="'caller_' + caller.id" class="tree-item">
                <relation-item 
                  :item="caller"

                  :show-recursive="showRecursive"

                ></relation-item>

      <!-- 空状态 -->
      <div v-if="analysisMode === 'calls' && !selectedFunction" class="empty-call-state">
        <div class="empty-icon">📞</div>
        <h3>函数调用关系分析</h3>
        <p>搜索并选择一个函数，查看其递归调用关系图</p>
        <div class="features">
          <div class="feature">✨ 支持多层递归展示</div>
          <div class="feature">🔍 智能调用关系分析</div>
          <div class="feature">📊 交互式图形可视化</div>
          <div class="feature">🎯 动态展开/折叠节点</div>
        </div>
      </div>

      <!-- 路径分析模式 -->
      <div v-show="analysisMode === 'path'" class="path-analysis-section">
        <div class="section-header">
          <h2>函数路径分析</h2>
          <button @click="clearPathResults" class="clear-results-btn">🗑️ 清除结果</button>
        </div>
        
        <!-- 函数选择区域 -->
        <div class="function-selection">
          <div class="function-selector">
            <h3>源函数</h3>

              <span class="function-name">{{ sourceFunction.name }}</span>
              <span class="function-file">{{ sourceFunction.file_path }}</span>

                >
                <ul v-if="sourceSearchResults.length" class="search-dropdown">

                    <strong>{{ func.name }}</strong>

                  </li>

          <div class="arrow">→</div>
          
          <div class="function-selector">

            </div>
            <div v-else>
              <input 
                type="text" 
                v-model="targetSearchTerm" 
                @input="searchTargetFunction"
                placeholder="搜索目标函数..."
                class="search-input"
              >
              <ul v-if="targetSearchResults.length" class="search-dropdown">
                <li v-for="func in targetSearchResults" :key="func.id" @click="selectPathFunction(func, 'target')">
                  <strong>{{ func.name }}</strong>
                  <div class="function-detail">{{ func.file_path }}</div>
                </li>

            </div>

        </div>
        
        <!-- 分析控制 -->
        <div class="analysis-controls">
          <button 
            @click="analyzePath" 
            :disabled="!sourceFunction || !targetFunction || isAnalyzing"
            class="analyze-btn"
          >
            <span v-if="isAnalyzing">🔄 分析中...</span>
            <span v-else>🚀 开始分析</span>

        </div>
        
        <!-- 路径分析结果 -->

              <span class="stat-item">总路径: {{ pathStatistics.total_paths || pathResults.length }}</span>

              <span class="stat-item">复杂度: {{ pathStatistics.complexity_score ? pathStatistics.complexity_score.toFixed(1) : 'N/A' }}</span>

          </div>
          
          <div class="path-list">
            <div 
              v-for="(path, index) in pathResults" 
              :key="index"
              class="path-item"
            >
              <div class="path-header">

        </div>
        
        <!-- 路径分析空状态 -->
        <div v-if="!pathResults.length && !isAnalyzing" class="empty-path-state">
          <div class="empty-icon">🎯</div>
          <h3>路径分析</h3>

// ToastMessage组件 (从原代码复制)
const ToastMessage = defineComponent({
  name: 'ToastMessage',
  setup(_, { expose }) {
    const current = ref(null);
    const fadingOut = ref(false);
    let timeoutId = null;
    let fadeTimeoutId = null;

    const show = (message, duration = 2000) => {
      if (timeoutId) clearTimeout(timeoutId);
      if (fadeTimeoutId) clearTimeout(fadeTimeoutId);

      current.value = message;
      fadingOut.value = false;

      timeoutId = setTimeout(() => {
        fadingOut.value = true;
        fadeTimeoutId = setTimeout(() => {
          current.value = null;
          fadingOut.value = false;
          timeoutId = null;
          fadeTimeoutId = null;
        }, 300);
      }, duration);
    };

    expose({ show });

    return { current, fadingOut };
  },
  template: `
    <transition name="toast-fade">
      <div v-if="current" class="toast-container" :class="{ 'fade-out': fadingOut }">
        {{ current }}
      </div>
    </transition>
  `
});

        },

        },

            ? `分析从 "${props.pageState?.pathSourceFunc?.name || '源函数'}" 到 "${props.pageState?.pathTargetFunc?.name || '目标函数'}" 的路径...`
            : `分析函数"${selectedObjectDescription.value}"的调用/被调用关系、数据流等...`,
          endpoint: props.pageState.analysisMode === 'path' ? '/ai/analyze_call_chain' : '/ai/analyze_function',
          systemPrompt: props.pageState.analysisMode === 'path'
            ? '你是一个专业的C语言代码分析专家。请基于提供的调用链信息进行分析，重点关注合理性、性能和优化建议。请用中文回答。'
            : '你是一个专业的C语言代码分析专家。请分析提供的函数信息，关注功能、复杂度、调用关系和优化建议。请用中文回答。'
        }
      };
      return configs[props.currentTab] || configs.overview;
    });
    
    // 计算动态按钮
    const dynamicButtons = computed(() => {
      const buttons = [];
      const pageState = props.pageState;
      
      // 关系图页面 - 文件分析
      if (props.currentTab === 'graph' && pageState.selectedFilePath) {
        buttons.push({

          type: 'primary',

      // 搜索页面 - 根据选中类型显示不同按钮

      <div class="toolbar-title">${titleText}</div>
      <button class="btn" onclick="doPrint()">打印</button>
      <button class="btn" onclick="doDownload()">下载HTML</button>
    </div>
    <div class="container">
      <div class="report-content">${htmlBody}</div>
    </div>
  </body>
  </html>`;
        win.document.open();
        win.document.write(fullHtml);
        win.document.close();
      },
      downloadReport: (format = 'md') => {
        if (!result.value) return;
        const pad = (n) => String(n).padStart(2, '0');
        const d = new Date();
        const ts = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
        const baseNameRaw = selectedObjectDescription.value || 'ai-analysis';
        const baseName = baseNameRaw.replace(/[^\w\u4e00-\u9fa5\-\s]+/g, '').trim().replace(/\s+/g, '-');
        let dataStr = '';
        let mime = '';
        let ext = '';
        if (format === 'html') {
          // 嵌入简单HTML，便于离线查看
          const htmlBody = (typeof marked !== 'undefined') ? marked(result.value) : (formattedResult?.value || String(result.value));
          dataStr = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><title>${baseName}</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/github.min.css"></head><body><main>${htmlBody}</main></body></html>`;
          mime = 'text/html;charset=utf-8';
          ext = 'html';
        } else {
          dataStr = String(result.value);
          mime = 'text/markdown;charset=utf-8';
          ext = 'md';
        }
        const blob = new Blob([dataStr], { type: mime });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${baseName || 'ai-analysis'}-${ts}.${ext}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }
    };
  },
  template: `
    <div class="ai-assistant">
      <!-- 悬浮按钮 -->
      <div class="ai-fab" @click="toggleOpen" :class="{ 'active': isOpen }">
        <svg v-if="!isOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <path d="M13 8H7"/>
          <path d="M17 12H7"/>
        </svg>
        <svg v-else width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </div>
      
      <!-- AI对话框 -->
      <div v-if="isOpen" class="ai-dialog">
        <div class="ai-header">
          <h3>🤖 {{ aiConfig.title }}</h3>
          <button @click="clearInput" class="clear-btn">清空</button>
        </div>
        
        <div class="ai-content">
          <!-- 动态按钮区域 -->
          <div v-if="dynamicButtons.length > 0" class="ai-dynamic-buttons">
            <div class="dynamic-buttons-header">
              <span>快速分析:</span>
            </div>
            <div class="dynamic-buttons-container">
              <button 
                v-for="button in dynamicButtons" 
                :key="button.id"
                @click="button.action"
                :class="['dynamic-btn', 'dynamic-btn-' + button.type]"
                :disabled="isLoading"
              >
                {{ button.text }}
              </button>
            </div>
          </div>
          

          
          
          
          <!-- 未选择对象提示 -->
          <div v-else-if="currentTab !== 'overview'" class="ai-no-selection">
            <div class="no-selection-header">
              <span>⚠️ 请先选择分析对象</span>
            </div>
            <div class="no-selection-content">
              <p>在开始AI分析之前，请先在当前页面选择一个对象：</p>
              <ul>
                <li v-if="currentTab === 'graph'">在文件树中选择一个文件</li>
                <li v-if="currentTab === 'search'">搜索并选择一个函数、变量或指针</li>
                <li v-if="currentTab === 'callgraph'">搜索并选择一个函数</li>
              </ul>
            </div>
          </div>
          
          <!-- 输入框 -->
          <div class="ai-input-group">
            <textarea 
              v-model="userInput"
              :placeholder="aiConfig.placeholder"
              class="ai-textarea"
              :disabled="isLoading || !hasSelectedObject"
              @keydown.ctrl.enter="handleSubmit"
            ></textarea>
            <button 
              @click="handleSubmit" 
              class="ai-submit-btn"
              :disabled="isLoading || !userInput.trim() || !hasSelectedObject"
            >
              <span v-if="!isLoading">发送</span>
              <span v-else>分析中...</span>
            </button>
          </div>
          
          <!-- 结果显示 -->
          <div v-if="result" class="ai-result">
            <div class="result-header">
              <h4>分析结果</h4>
              <div class="result-actions">
                <button class="action-btn" @click="openFullscreen">全屏查看</button>
                <div class="action-split"></div>
                <button class="action-btn" @click="downloadReport('md')">下载报告</button>
              </div>
            </div>
            <div class="result-content" v-html="formattedResult"></div>
          </div>
          
          <!-- 全屏弹窗查看 -->
          <div v-if="isFullscreen" class="ai-fullscreen-overlay">
            <div class="ai-fullscreen-container">
              <div class="ai-fullscreen-header">
                <div class="fs-title">AI 分析报告 - {{ selectedObjectDescription }}</div>
                <div class="fs-actions">
                  <button class="fs-action-btn" @click="downloadReport('md')">下载MD</button>
                  <button class="fs-action-btn" @click="downloadReport('html')">下载HTML</button>
                  <button class="fs-action-btn fs-close" @click="closeFullscreen">关闭</button>
                </div>
              </div>
              <div class="ai-fullscreen-body">
                <div class="ai-fullscreen-content" v-html="formattedResult"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `
});

// AnalysisPanel组件 (从原代码复制)
const AnalysisPanel = defineComponent({
  name: 'AnalysisPanel',
  props: {
    analysisdata: {
      type: Object,
      default: () => ({
        function_count: 0,
        variable_count: 0,
        data_pointer_count: 0,
        function_pointer_count: 0,
        file_path: '',
        total_count: 0
      })
    }
  },
  setup(props) {
    const maxValue = computed(() => Math.max(
      props.analysisdata.function_count || 0,
      props.analysisdata.variable_count || 0,
      props.analysisdata.data_pointer_count || 0,
      props.analysisdata.function_pointer_count || 0
    ));

    const calculateBarHeight = (value) => {
      if (maxValue.value === 0) return 5;
      return Math.max(5, (value / maxValue.value) * 100);
    };

    const totalCount = computed(() => 
        (props.analysisdata.function_count || 0) +
        (props.analysisdata.variable_count || 0) +
        (props.analysisdata.data_pointer_count || 0) +
        (props.analysisdata.function_pointer_count || 0)
    );

    const analysisTime = computed(() => {
      const now = new Date();
      return now.toLocaleTimeString();
    });

    return {
      maxValue,
      calculateBarHeight,
      totalCount,
      analysisTime
    };
  },
  template: `
    <div class="analysis-panel">
      <div class="analysis-header">
        <h3>文件分析报告</h3>
        <div class="file-path">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
            <polyline points="13 2 13 9 20 9"/>
          </svg>
          <span>{{ analysisdata.file_path || '未指定文件' }}</span>
        </div>
      </div>

      <div class="analysis-metrics">
        <div class="metric-card function">
          <div class="metric-value">{{ analysisdata.function_count || 0 }}</div>
          <div class="metric-label">函数数量</div>
          <div class="metric-icon">ƒ</div>
        </div>

        <div class="metric-card variable">
          <div class="metric-value">{{ analysisdata.variable_count || 0 }}</div>
          <div class="metric-label">变量数量</div>
          <div class="metric-icon">𝓋</div>
        </div>

        <div class="metric-card data-pointer">
          <div class="metric-value">{{ analysisdata.data_pointer_count || 0 }}</div>
          <div class="metric-label">数据指针</div>
          <div class="metric-icon">→</div>
        </div>

        <div class="metric-card function-pointer">
          <div class="metric-value">{{ analysisdata.function_pointer_count || 0 }}</div>
          <div class="metric-label">函数指针</div>
          <div class="metric-icon">↦</div>
        </div>
      </div>

      <div class="analysis-chart">
        <div class="chart-container">
          <div class="chart-bar function"
               :style="{ height: calculateBarHeight(analysisdata.function_count) + '%' }">
            {{ analysisdata.function_count || 0 }}
          </div>
          <div class="chart-bar variable"
               :style="{ height: calculateBarHeight(analysisdata.variable_count) + '%' }">
            {{ analysisdata.variable_count || 0 }}
          </div>
          <div class="chart-bar data-pointer"
               :style="{ height: calculateBarHeight(analysisdata.data_pointer_count) + '%' }">
            {{ analysisdata.data_pointer_count || 0 }}
          </div>
          <div class="chart-bar function-pointer"
               :style="{ height: calculateBarHeight(analysisdata.function_pointer_count) + '%' }">
            {{ analysisdata.function_pointer_count || 0 }}
          </div>
        </div>
        <div class="chart-legend">
          <div>ƒ 函数</div>
          <div>𝓋 变量</div>
          <div>→ 数据指针</div>
          <div>↦ 函数指针</div>
        </div>
      </div>

      <div class="analysis-summary">
        <div class="summary-item">
          <span>总元素数量</span>
          <span class="summary-value">{{ totalCount }}</span>
        </div>
        <div class="summary-item">
          <span>分析时间</span>
          <span class="summary-value">{{ analysisTime }}</span>
        </div>
      </div>
    </div>
  `
});

// ==================== 主应用 ====================
createApp({
  components: { 
    'overview-panel': OverviewPanel,
    'graph-panel': GraphPanel,
    'search-panel': SearchPanel,
    'call-graph-panel': CallGraphPanel,
    'relation-item': RelationItem,
    'code-display': CodeDisplay, 
    'toast-message': ToastMessage,
    'analysis-panel': AnalysisPanel,
    'file-content-modal': FileContentModal,
    'ai-assistant': AiAssistant
  },
  setup() {
    const toastRef = ref(null);
    const aiAssistantRef = ref(null);
    const graphPanelRef = ref(null);
    const activeTab = ref('overview');
    const tree = ref([]);
    const loading = ref(true);
    const func_name = ref("");
    const source_code = ref("");
    const tree_refs = new Map();
    
    // 页面状态管理
    const pageStates = ref({
      graph: {
        selectedFilePath: null,
        selectedFileName: null
      },
      search: {
        selectedType: null,
        selectedId: null,
         selectedName: null,
         selectedFilePath: null
      },
      callgraph: {
        selectedFunctionId: null,
        selectedFunctionName: null,
        analysisMode: 'calls', // 'calls' | 'path'
        pathSourceFunc: null,  // { id, name }
        pathTargetFunc: null   // { id, name }
      }
    });

    const setref = (key, el) => {
      if (el && !tree_refs.has(key)) {
        tree_refs.set(key, el);
      }
    };

    const switchTab = (tabName) => {
      activeTab.value = tabName;
      console.log('切换到Tab:', tabName);
      
      // 当切换到关系图tab时，懒加载文件树
      if (tabName === 'graph' && tree.value.length === 0) {
        loadTreeData();
      }
    };

    const handleFileSelected = (filePath) => {
      console.log('File selected:', filePath);
      // 更新页面状态
      pageStates.value.graph.selectedFilePath = filePath;
      pageStates.value.graph.selectedFileName = filePath.split('/').pop();
    };

    const handleTreeCollapsed = (collapsed) => {
      console.log('Tree collapsed:', collapsed);
    };

    const handleFunctionSelected = (funcData) => {
      console.log('Function selected:', funcData);
      pageStates.value.search.selectedType = 'function';
      pageStates.value.search.selectedId = funcData.id;
      pageStates.value.search.selectedName = funcData.name;
      // 切换到关系图tab并展示节点连通图
      switchTab('graph');
      nextTick(() => {
        if (graphPanelRef.value && funcData.id) {
          graphPanelRef.value.loadNodeGraph(funcData.id, funcData.name || funcData.id, 'function', funcData.file_path || '');
        }
      });
    };

    const handleVariableSelected = (variableData) => {
      console.log('Variable selected:', variableData);
      pageStates.value.search.selectedType = 'variable';
      pageStates.value.search.selectedId = variableData.id;
      pageStates.value.search.selectedName = variableData.name;
      pageStates.value.search.selectedFilePath = variableData.file_path || null;
      switchTab('graph');
      nextTick(() => {
        if (graphPanelRef.value && variableData.id) {
          graphPanelRef.value.loadNodeGraph(variableData.id, variableData.name || variableData.id, 'variable', variableData.file_path || '');
        }
      });
    };

    const handlePointerSelected = (pointerData) => {
      console.log('Pointer selected:', pointerData);
      pageStates.value.search.selectedType = pointerData.type;
      pageStates.value.search.selectedId = pointerData.id;
      pageStates.value.search.selectedName = pointerData.name;
      switchTab('graph');
      nextTick(() => {
        if (graphPanelRef.value && pointerData.id) {
          graphPanelRef.value.loadNodeGraph(pointerData.id, pointerData.name || pointerData.id, pointerData.type, pointerData.file_path || '');
        }
      });
    };
    
    const handleCallGraphFunctionSelected = (functionData) => {
      console.log('CallGraph function selected:', functionData);
      // 更新页面状态
      pageStates.value.callgraph.selectedFunctionId = functionData.id;
      pageStates.value.callgraph.selectedFunctionName = functionData.name;
    };

    const handlePathFunctionsChanged = ({ source, target }) => {
      pageStates.value.callgraph.pathSourceFunc = source ? { id: source.id, name: source.name } : null;
      pageStates.value.callgraph.pathTargetFunc = target ? { id: target.id, name: target.name } : null;
    };

    const handleCallAnalysisModeChanged = (mode) => {
      pageStates.value.callgraph.analysisMode = mode;
    };

    const handleAiResult = (result) => {
      console.log('AI分析结果:', result);
      // 可以在这里处理AI分析结果，比如显示toast消息
      if (toastRef.value) {
        toastRef.value.show('AI分析完成', 3000);
      }
    };
    
    // 获取当前页面状态
    const getCurrentPageState = () => {
      const currentTab = activeTab.value;
      const state = pageStates.value[currentTab];
      
      switch (currentTab) {
        case 'graph':
          return {
            tab: 'graph',
            selectedFilePath: state.selectedFilePath,
            selectedFileName: state.selectedFileName
          };
        case 'search':
          return {
            tab: 'search',
            selectedType: state.selectedType,
            selectedId: state.selectedId,
            selectedName: state.selectedName
          };
        case 'callgraph':
          return {
            tab: 'callgraph',
            selectedFunctionId: state.selectedFunctionId,
            selectedFunctionName: state.selectedFunctionName,
            analysisMode: state.analysisMode,
            pathSourceFunc: state.pathSourceFunc,
            pathTargetFunc: state.pathTargetFunc
          };
        default:
          return {
            tab: currentTab,
            state: 'no_selection'
          };
      }
    };

    // 加载文件树数据
    const loadTreeData = async () => {
      if (tree.value.length > 0) return; // 如果已经加载过，直接返回
      
      try {
        loading.value = true;
        const response = await fetch('/func_tree');
        const data = await response.json();
        tree.value = data;
        loading.value = false;
      } catch (error) {
        console.error('Failed to load tree data:', error);
        loading.value = false;
      }
    };

    onMounted(() => {
      console.log('Vue应用已挂载');
      // 不再在页面加载时立即加载文件树
    });

    provide('setref', setref);

    return {
      activeTab,
      switchTab,
      tree,
      loading,
      func_name,
      source_code,
      toastRef,
      aiAssistantRef,
      graphPanelRef,
      pageStates,
      getCurrentPageState,
      handleFileSelected,
      handleTreeCollapsed,
      handleFunctionSelected,
      handleVariableSelected,
      handlePointerSelected,
      handleCallGraphFunctionSelected,
      handleAiResult
    };
  }
}).mount('#app');
</script>
