<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>内核源码分析系统 - Tab版本</title>
  <!-- 引入 Vue 3 -->
  <script src="../static/vue.js"></script>
  <!-- 引入 vis-network -->
  <script src="../static/vis-network.js"></script>
  <!-- 引入词云图库 -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-cloud@1.2.5/build/d3.layout.cloud.js"></script>
  <script src="../static/main.js"></script>
  <link href="../static/vis-network.css" rel="stylesheet" type="text/css" />
  <link href="../static/main.css" rel="stylesheet" type="text/css" />
  <link href="../static/github.min.css" rel="stylesheet" type="text/css" />
  <script src="../static/highlight.js"></script>
  <script src="../static/c.min.js"></script>
  <script src="../static/marked.min.js"></script>
</head>
<body>
<div id="app">
  <!-- Header -->
<div class="header">
    <img style="margin-right:10px;" src="../static/icons/hdu.svg">
  <div class="title">内核源码自动分析原型系统</div>
  </div>

  <!-- Tab导航 -->
  <div class="tab-navigation">
    <button 
      class="tab-button" 
      :class="{ 'active': activeTab === 'overview' }"
      @click="switchTab('overview')"
    >
      🏠 概览
    </button>
    <button 
      class="tab-button" 
      :class="{ 'active': activeTab === 'graph' }"
      @click="switchTab('graph')"
    >
      🕸️ 关系图
    </button>
    <button 
      class="tab-button" 
      :class="{ 'active': activeTab === 'search' }"
      @click="switchTab('search')"
    >
      🔍 搜索
    </button>
    <button 
      class="tab-button" 
      :class="{ 'active': activeTab === 'callgraph' }"
      @click="switchTab('callgraph')"
    >
      📞 调用关系
    </button>

  </div>

  <!-- Tab内容区域 -->
  <div class="tab-content">
    <!-- Tab 1: 概览 -->
    <div v-show="activeTab === 'overview'" class="tab-panel">
      <overview-panel></overview-panel>
    </div>

    <!-- Tab 2: 关系图 -->
    <div v-show="activeTab === 'graph'" class="tab-panel">
      <graph-panel
        ref="graphPanelRef"
        :tree="tree"
        :loading="loading"
        @file-selected="handleFileSelected"
        @tree-collapsed="handleTreeCollapsed"
      ></graph-panel>
    </div>

    <!-- Tab 3: 搜索 -->
    <div v-show="activeTab === 'search'" class="tab-panel">
      <search-panel 
        ref="searchPanelRef"
        @function-selected="handleFunctionSelected"
        @variable-selected="handleVariableSelected"
        @pointer-selected="handlePointerSelected"
      ></search-panel>
    </div>

    <!-- Tab 4: 调用关系 -->
    <div v-show="activeTab === 'callgraph'" class="tab-panel">
      <call-graph-panel 
        @function-selected="handleCallGraphFunctionSelected"
        @path-functions-changed="handlePathFunctionsChanged"
        @analysis-mode-changed="handleCallAnalysisModeChanged"
      ></call-graph-panel>
    </div>


  </div>

  <!-- 全局组件 -->
  <toast-message ref="toastRef"></toast-message>
  
  <!-- AI助手悬浮框 -->
  <ai-assistant 
    ref="aiAssistantRef"
    :current-tab="activeTab"
    :page-state="pageStates[activeTab]"
    @ai-result="handleAiResult"
  ></ai-assistant>
</div>

<script>
const { createApp, ref, onMounted, watch, defineComponent, nextTick, reactive, provide, inject, computed, getCurrentInstance } = Vue;

// ==================== 文件内容查看弹窗组件 ====================
const FileContentModal = defineComponent({
  name: 'FileContentModal',
  props: {
    visible: Boolean,
    filePath: String,
    fileName: String
  },
  emits: ['close'],
  setup(props, { emit }) {
    const content = ref('');
    const loading = ref(false);
    const error = ref('');
    const fileExtension = ref('');
    const lines = Vue.computed(() => (content.value ? content.value.split('\n') : []));

    const fetchFileContent = async () => {
      if (!props.filePath) {
        console.error('fetchFileContent: 文件路径为空');
        error.value = '文件路径为空';
        return;
      }
      
      console.log('fetchFileContent: 开始获取文件内容', props.filePath);
      loading.value = true;
      error.value = '';
      
      try {
        const url = `/file_content?file_path=${encodeURIComponent(props.filePath)}`;
        console.log('fetchFileContent: 请求URL', url);
        
        const response = await fetch(url);
        console.log('fetchFileContent: 响应状态', response.status, response.statusText);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        console.log('fetchFileContent: 响应数据', data);
        
        if (data.error) {
          error.value = data.message;
          console.error('fetchFileContent: API返回错误', data.message);
        } else {
          content.value = data.content || '';
          fileExtension.value = data.file_extension || '';
          console.log('fetchFileContent: 文件内容获取成功', {
            contentLength: content.value.length,
            fileExtension: fileExtension.value
          });
        }
      } catch (err) {
        error.value = '获取文件内容失败: ' + err.message;
        console.error('fetchFileContent: 请求失败', err);
      } finally {
        loading.value = false;
      }
    };

    const closeModal = () => {
      emit('close');
    };

    // 监听visible变化，当弹窗显示时获取文件内容
    watch(() => props.visible, (newVal) => {
      if (newVal) {
        // 弹窗显示时重置状态
        content.value = '';
        error.value = '';
        fileExtension.value = '';
        
        if (props.filePath) {
          console.log('弹窗显示，开始获取文件内容:', props.filePath);
          fetchFileContent();
        } else {
          console.warn('弹窗显示但文件路径为空');
          error.value = '文件路径为空，无法获取文件内容';
        }
      }
    });

    // 监听content变化，应用语法高亮
    watch(() => content.value, (newContent) => {
      if (newContent) {
        nextTick(() => {
          // 确保highlight.js库已加载
          if (typeof hljs !== 'undefined') {
            const codeElement = document.querySelector('.file-content code');
            if (codeElement) {
              try {
                // 先清除之前的语法高亮
                codeElement.classList.remove('hljs');
                // 使用textContent而不是innerHTML，确保特殊字符被正确转义
                codeElement.textContent = newContent;
                
                // 应用新的语法高亮
                hljs.highlightElement(codeElement);
                console.log('语法高亮应用成功');
              } catch (error) {
                console.error('语法高亮应用失败:', error);
              }
            }
          } else {
            console.warn('highlight.js库未加载');
          }
        });
      }
    });

    return {
      content,
      loading,
      error,
      fileExtension,
      lines,
      closeModal
    };
  },
  template: `
    <teleport to="body">
      <div v-if="visible" class="modal-overlay" @click="closeModal">
        <div class="modal-content" @click.stop>
          <div class="modal-header">
            <h3>📄 {{ fileName || '文件内容' }}</h3>
            <button @click="closeModal" class="close-btn">×</button>
          </div>
          <div class="modal-body">
            <div v-if="loading" class="loading">
              <div class="spinner"></div>
              正在加载文件内容...
            </div>
            <div v-else-if="error" class="error">
              ❌ {{ error }}
            </div>
            <div v-else class="file-content">
              <div class="code-with-lines">
                <div class="line-numbers">
                  <div v-for="(l, idx) in lines" :key="idx">{{ idx + 1 }}</div>
                </div>
                <pre><code :class="'language-' + fileExtension.replace('.', '')">{{ content }}</code></pre>
              </div>
            </div>
          </div>
        </div>
      </div>
    </teleport>
  `
});

// ==================== 概览面板组件 ====================
const OverviewPanel = defineComponent({
  name: 'OverviewPanel',
  components: {
    FileContentModal
  },
  setup() {
    // 统一处理子组件 open-file 事件，复用 GraphPanel 的 viewFileContent
    onMounted(() => {
      const handler = (e) => {
        const { filePath, fileName } = e.detail || {};
        try {
          // 优先尝试 GraphPanel 的方法
          const graphPanelEl = document.querySelector('.graph-container');
          if (graphPanelEl && graphPanelEl.__vueParentComponent) {
            const appCtx = graphPanelEl.__vueParentComponent.ctx;
            if (appCtx && typeof appCtx.viewFileContent === 'function') {
              appCtx.viewFileContent(filePath, fileName);
              return;
            }
          }
          // 退化：在 OverviewPanel 上尝试
          const overviewEl = document.querySelector('.overview-container');
          if (overviewEl && overviewEl.__vueParentComponent) {
            const appCtx2 = overviewEl.__vueParentComponent.ctx;
            if (appCtx2 && typeof appCtx2.viewFileContent === 'function') {
              appCtx2.viewFileContent(filePath, fileName);
              return;
            }
          }
          console.warn('未找到可用的 viewFileContent 处理器');
        } catch (err) {
          console.error('处理 open-file 事件失败:', err);
        }
      };
      document.addEventListener('open-file', handler);
    });
    const stats = ref({
      total_files: 0,
      total_functions: 0,
      total_variables: 0
    });

    // 文件内容弹窗相关状态
    const showFileContentModal = ref(false);
    const selectedFilePath = ref('');
    const selectedFileName = ref('');

    // 加载统计数据
    const loadStats = async () => {
      try {
        // 从后端获取全局统计信息
        const response = await fetch('/global_statistics');
        if (response.ok) {
          const data = await response.json();
          stats.value = {
            total_files: data.total_files || 0,
            total_functions: data.total_functions || 0,
            total_variables: data.total_variables || 0,
            total_data_pointers: data.total_data_pointers || 0,
            total_function_pointers: data.total_function_pointers || 0,
            total_call_relations: data.total_call_relations || 0,
            total_access_relations: data.total_access_relations || 0,
            total_read_relations: data.total_read_relations || 0,
            total_write_relations: data.total_write_relations || 0
          };
          

        } else {
          // 如果API不可用，使用模拟数据
          stats.value = {
            total_files: 2847,
            total_functions: 45623,
            total_variables: 18934,
            total_data_pointers: 1234,
            total_function_pointers: 567,
            total_call_relations: 89012,
            total_access_relations: 34567,
            total_read_relations: 25000,
            total_write_relations: 9567
          };
        }
      } catch (error) {
        console.error('Failed to load stats:', error);
        // 使用模拟数据作为后备
        stats.value = {
          total_files: 2847,
          total_functions: 45623,
          total_variables: 18934,
          total_data_pointers: 1234,
          total_function_pointers: 567,
          total_call_relations: 89012,
          total_access_relations: 34567,
          total_read_relations: 25000,
          total_write_relations: 9567
        };
      }
    };

    // 加载访问热点函数
    const loadHotAccessFunctions = async () => {
      try {
        const response = await fetch(`/hot_access_functions?count=${hotAccessFunctionCount.value}`);
        if (response.ok) {
          const data = await response.json();
          if (data.functions && data.functions.length > 0) {
            hotAccessFunctions.value = data.functions;
          }
        }
      } catch (error) {
        console.error('Failed to load hot access functions:', error);
      }
    };

    // 加载热点函数（被调用次数最多的）
    const loadHotFunctions = async () => {
      try {
        const response = await fetch(`/hot_functions?count=${hotFunctionCount.value}`);
        if (response.ok) {
          const data = await response.json();
          if (data.functions && data.functions.length > 0) {
            hotFunctions.value = data.functions;
            // 调试信息：打印第一个函数的路径
            if (data.functions.length > 0) {
              console.log('热点函数路径示例:', data.functions[0].file_path);
            }
          }
        }
      } catch (error) {
        console.error('Failed to load hot functions:', error);
      }
    };

    // 加载热点变量
    const loadHotVariables = async () => {
      try {
        const response = await fetch(`/hot_access_variables?count=${hotVariableCount.value}`);
        if (response.ok) {
          const data = await response.json();
          if (data.variables && data.variables.length > 0) {
            hotVariables.value = data.variables;
            // 调试信息：打印第一个变量的路径
            if (data.variables.length > 0) {
              console.log('热点变量路径示例:', data.variables[0].file_path);
            }
          }
        }
      } catch (error) {
        console.error('Failed to load hot variables:', error);
      }
    };

    onMounted(() => {
      loadStats();
      loadHotFunctions();
      loadHotAccessFunctions();
      loadHotVariables();
      watchAndGenerateWordcloud();
    });



    const hotFunctions = ref([]);
    const hotVariables = ref([]);
    const hotAccessFunctions = ref([]);
    
    // 热点显示数量控制（默认50）
    const hotFunctionCount = ref(50);
    const hotVariableCount = ref(50);
    const hotAccessFunctionCount = ref(50);
    
    // 视图模式控制（默认词云）
    const hotFunctionViewMode = ref('wordcloud');
    const hotVariableViewMode = ref('wordcloud');
    const hotAccessFunctionViewMode = ref('wordcloud');

    // 查看文件内容的方法
    const viewFileContent = (filePath, fileName) => {
      console.log('OverviewPanel viewFileContent被调用', { filePath, fileName });
      
      // 确保有文件路径，如果没有则使用当前选中的文件路径
      let targetFilePath = filePath || selectedFilePath.value;
      if (!targetFilePath) {
        console.error('没有可用的文件路径');
        return;
      }
      
      console.log('原始路径:', targetFilePath);
      console.log('路径是否包含linux-6.6:', targetFilePath.includes('linux-6.6'));
      
      // 确保路径格式正确，如果路径不包含linux-6.6，尝试添加
      if (targetFilePath && !targetFilePath.includes('linux-6.6')) {
        if (targetFilePath.startsWith('/')) {
          targetFilePath = 'linux-6.6' + targetFilePath;
        } else {
          targetFilePath = 'linux-6.6/' + targetFilePath;
        }
        console.log('路径已标准化:', targetFilePath);
      } else {
        console.log('路径已经是标准格式');
      }
      
      selectedFilePath.value = targetFilePath;
      selectedFileName.value = fileName;
      showFileContentModal.value = true;
      console.log('弹窗状态已更新', { 
        showFileContentModal: showFileContentModal.value,
        selectedFileName: selectedFileName.value,
        selectedFilePath: selectedFilePath.value,
        originalPath: filePath
      });
    };

    // 关闭文件内容弹窗
    const closeFileContentModal = () => {
      showFileContentModal.value = false;
      selectedFileName.value = '';
      // 注意：这里不清除selectedFilePath，因为用户可能还想查看文件内容
      console.log('文件内容弹窗已关闭');
    };

    // 生成词云图（美化样式 + 交互提示）
    const generateWordcloud = (containerId, data, sizeField, textField) => {
      const container = document.getElementById(containerId);
      if (!container) {
        console.error(`容器 ${containerId} 不存在`);
        return;
      }
      
      // 清空容器
      container.innerHTML = '';
      // 容器样式
      container.style.position = 'relative';
      container.style.background = 'linear-gradient(180deg, #ffffff 0%, #f8fafc 100%)';
      container.style.border = '1px solid #e5e7eb';
      container.style.borderRadius = '12px';
      container.style.padding = '12px 12px 4px 12px';
      container.style.boxShadow = '0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06)';
      
      // 工具提示元素
      const tooltip = document.createElement('div');
      tooltip.className = 'wc-tooltip';
      Object.assign(tooltip.style, {
        position: 'absolute',
        zIndex: 10,
        display: 'none',
        maxWidth: '420px',
        background: 'rgba(17,24,39,0.92)',
        color: '#fff',
        padding: '10px 12px',
        borderRadius: '10px',
        boxShadow: '0 8px 24px rgba(0,0,0,0.18)',
        fontSize: '12px',
        lineHeight: '1.4',
        backdropFilter: 'blur(2px)'
      });
      container.appendChild(tooltip);
      
      // 准备词云数据
      const counts = data.map(item => Number(item[sizeField]) || 0);
      const minCount = counts.length ? Math.min(...counts) : 0;
      const maxCount = counts.length ? Math.max(...counts) : 1;
      const denom = Math.max(1, maxCount - minCount);
      const words = data.map(item => {
        const value = Number(item[sizeField]) || 0;
        const norm = (value - minCount) / denom;
        const size = Math.round(14 + norm * (48 - 14));
        return {
          text: item[textField],
          size,
          meta: item,
          value
        };
      });
      
      // 检查d3和d3.layout.cloud是否可用
      if (typeof d3 === 'undefined') {
        console.error('d3库未加载');
        return;
      }
      
      if (typeof d3.layout === 'undefined' || typeof d3.layout.cloud === 'undefined') {
        console.error('d3.layout.cloud未加载');
        return;
      }
      
      // 设置词云布局
      const layout = d3.layout.cloud()
        .size([container.offsetWidth, 400])
        .words(words)
        .padding(2)
        .rotate(() => 0) // 不旋转文字
        .fontSize(d => d.size)
        .on("end", draw);
      
      function draw(words) {
        // 比例分桶着色：Top 5% 红色、Top 30% 深蓝色、其余灰色；同一桶内按名次细微变化
        const total = words.length || 1;
        const primaryRatio = 0.05;  // 前5%
        const secondaryRatio = 0.30; // 前30%
        const topN1 = Math.max(1, Math.round(total * primaryRatio));
        const topN2 = Math.max(topN1, Math.round(total * secondaryRatio));

        // 计算名次（按数值降序）
        const rankMap = new Map();
        const ranked = words
          .map(w => ({
            id: `${w.text}|${(w.meta && w.meta.file_path) ? w.meta.file_path : ''}`,
            value: w.value,
            text: w.text
          }))
          .sort((a, b) => {
            if (b.value !== a.value) return b.value - a.value;
            return a.text.localeCompare(b.text);
          });
        ranked.forEach((item, idx) => rankMap.set(item.id, idx + 1));

        const getColorByRank = (d) => {
          const id = `${d.text}|${(d.meta && d.meta.file_path) ? d.meta.file_path : ''}`;
          const rank = rankMap.get(id) || total;
          if (rank <= topN1) {
            // 红色系（越靠前越艳）
            const t = (rank - 1) / Math.max(1, topN1 - 1);
            const hue = 10 - Math.round(t * 6);          // 10 → 4
            const sat = 88 + Math.round((1 - t) * 7);     // 95% → 88%
            const light = 44 - Math.round((1 - t) * 6);   // 50% → 44%
            return `hsl(${hue} ${sat}% ${light}%)`;
          }
          if (rank <= topN2) {
            // 深蓝色系（越靠前越饱和略暗）
            const t = (rank - topN1) / Math.max(1, topN2 - topN1);
            const hue = 218 + Math.round(t * 6);          // 218 → 224
            const sat = 70 + Math.round((1 - t) * 20);     // 90% → 70%
            const light = 40 + Math.round(t * 6);          // 40% → 46%
            return `hsl(${hue} ${sat}% ${light}%)`;
          }
          // 灰色系（尾部）：轻微变化
          const t = (rank - topN2) / Math.max(1, total - topN2);
          const light = 62 - Math.round(t * 10);           // 62% → 52%
          return `hsl(0 0% ${light}%)`;
        };

        const svg = d3.select(container)
          .append("svg")
          .attr("width", layout.size()[0])
          .attr("height", layout.size()[1]);
        
        const g = svg.append("g")
          .attr("transform", "translate(" + layout.size()[0] / 2 + "," + layout.size()[1] / 2 + ")");
        
        const texts = g.selectAll("text")
          .data(words)
          .enter().append("text")
          .style("font-size", d => d.size + "px")
          .style("font-family", "PingFang SC, Microsoft YaHei, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif")
          .style("fill", (d) => getColorByRank(d))
          .style("font-weight", (d) => {
            const norm = Math.max(0, Math.min(1, (d.value - minCount) / denom));
            return 400 + Math.round(norm * 400); // 400 → 800
          })
          .style("letter-spacing", (d) => (d.size < 20 ? "0.2px" : "0px"))
          .style("opacity", 0.9)
          .style("cursor", "pointer")
          .attr("text-anchor", "middle")
          .attr("transform", d => "translate(" + [d.x, d.y] + ")rotate(" + d.rotate + ")")
          .text(d => d.text)
          // 细微描边提升对比度
          .style("paint-order", "stroke")
          .style("stroke", "rgba(255,255,255,0.65)")
          .style("stroke-width", "1px")
          // 基础阴影，提升可读性
          .style("filter", "drop-shadow(0 1px 1px rgba(0,0,0,0.15))")
          .on("mouseenter", function() {
            const el = d3.select(this);
            const currentSize = parseFloat(el.style("font-size")) || 14;
            el
              .style("opacity", 1)
              .style("filter", "drop-shadow(0 1px 1px rgba(0,0,0,0.35))")
              .style("font-size", (currentSize * 1.1) + "px");
          })
          .on("mouseleave", function() {
            const el = d3.select(this);
            const currentSize = parseFloat(el.style("font-size")) || 14;
            el
              .style("opacity", 0.9)
              .style("filter", "drop-shadow(0 1px 1px rgba(0,0,0,0.15))")
              .style("font-size", (currentSize / 1.1) + "px");
          })
          .on("click", function(event, d) {
            // 信息展示（类似列表项）
            const filePath = d.meta && d.meta.file_path ? d.meta.file_path : '未知路径';
            let countLabel = '次数';
            if (sizeField === 'call_count') countLabel = '被调用';
            else if (sizeField === 'variable_access_count') countLabel = '访问变量';
            else if (sizeField === 'access_count') countLabel = '被访问';

            tooltip.innerHTML = `
              <div style="font-weight:600;font-size:13px;margin-bottom:6px;">${d.text}</div>
              <div style="opacity:0.9;word-break:break-all;">📄 ${filePath}</div>
              <div style="margin-top:4px;">📊 ${countLabel} ${d.value} 次</div>
              <div style="margin-top:8px;text-align:right;">
                <button id="wc-open-btn" style="background:#3B82F6;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;">查看文件</button>
              </div>
            `;

// ==================== TreeNode组件定义 (懒加载版本) ====================
const TreeNode = defineComponent({
  name: 'TreeNode',
  props: ['node', 'reloaddata', 'viewFileContent', 'selectedFilePath'],
  setup(props) {
    const isOpen = ref(false);
    const isLoading = ref(false);
    // 使用响应式 children，初始为 props.node.children（可能为空数组）
    const children = ref(props.node.children || []);
    
    const isSelected = computed(() => {
      if (props.node.type === 'file') {
        const nodePath = props.node.full_path || props.node.name;
        return nodePath === props.selectedFilePath;
      }
      return false;
    });

    const toggle = async () => {
      if (props.node.type === 'folder') {
        // 如果要展开，且没有子节点数据但标记有子项，则懒加载
        if (!isOpen.value) {
          if (children.value.length === 0 && props.node.has_children) {
            isLoading.value = true;
            try {
              const path = props.node.full_path || props.node.name;
              const res = await fetch(`http://localhost:5002/directory_children?path=${encodeURIComponent(path)}`);
              const data = await res.json();
              children.value = data;
            } catch (err) {
              console.error('加载子目录失败:', err);
            } finally {
              isLoading.value = false;
            }
          }
          isOpen.value = true;
        } else {
          isOpen.value = false;
        }
      }
      
      if (props.node.type === 'file') {
        props.reloaddata(props.node.full_path || props.node.name);
      }
      console.log('点击状态和是否打开:', isSelected.value, isOpen.value);
    };

    const showFileContent = (event) => {
      try {
        event.stopPropagation();
        event.preventDefault();
        
        console.log('showFileContent被调用', {
          nodeType: props.node.type,
          hasViewFileContent: !!props.viewFileContent,
          node: props.node
        });
        
        if (props.node.type === 'file' && props.viewFileContent) {
          let filePath = props.node.full_path || props.node.name;
          const fileName = props.node.name.split("/").pop();
          

          
          console.log('调用viewFileContent', { filePath, fileName, originalPath: props.node.full_path || props.node.name });
          props.viewFileContent(filePath, fileName);
        }
      } catch (error) {
        console.error('showFileContent错误:', error);
      }
    };

    // 自动展开：当选中的文件路径变化时，如果是当前文件夹的后代，自动展开
    watch(() => props.selectedFilePath, async (newPath) => {
      if (newPath && props.node.type === 'folder' && !isOpen.value) {
        const folderPath = props.node.full_path || props.node.name;
        if (newPath.startsWith(folderPath + '/')) {
          if (children.value.length === 0 && props.node.has_children) {
            isLoading.value = true;
            try {
              const path = props.node.full_path || props.node.name;
              const res = await fetch(`/directory_children?path=${encodeURIComponent(path)}`);
              const data = await res.json();
              children.value = data;
            } catch (err) {
              console.error('自动展开加载子目录失败:', err);
            } finally {
              isLoading.value = false;
            }
          }
          isOpen.value = true;
        }
      }
    }, { immediate: true });

    return { isOpen, isLoading, children, toggle, isSelected, showFileContent };
  },
  template:`
    <li>
      <div @click="toggle" class="node-content" :class="{ 'selected-file': isSelected && node.type === 'file' }">
        <span v-if="node.type === 'folder'" >
          <img style="margin-right:10px;" v-show="isOpen" src="../static/icons/pixel--angle-down.svg" alt="展开" width="20" height="20">
          <img v-show="!isOpen" src="../static/icons/pixel--folder-solid.svg" alt="文件夹" width="24" height="24">
          <img style="margin-right:5px;" v-show="!isOpen" src="../static/icons/pixel--angle-right .svg" alt="收起" width="24" height="24">
          <img v-show="isOpen" src="../static/icons/pixel--folder-open.svg" alt="文件夹" width="24" height="24">
          <span class="folder">{{ node.name.split("/").pop() }}</span>
        </span>
        <span v-else class="file-node" :class="{ 'selected': isSelected }">
          <img src="../static/icons/pixel--giphy.svg"  width="24" height="24"> 
          <span class="file-name">{{ node.name.split("/").pop() }}</span>
          <button @click="showFileContent" class="view-content-btn" title="查看文件内容">
            <img src="../static/icons/eye.svg" alt="查看内容" width="16" height="16">
          </button>
        </span>
      </div>
      
      <!-- 加载中提示 -->
      <div v-if="isLoading" style="padding-left: 24px; color: #999; font-style: italic;">加载中...</div>
      
      <!-- 子节点列表 -->
      <ul v-show="isOpen && children.length">
        <tree-node
          v-for="(child, index) in children"
          :key="child.full_path || child.name + '-' + index"
          :node="child"
          :reloaddata="reloaddata"
          :viewFileContent="viewFileContent"
          :selectedFilePath="selectedFilePath"
        ></tree-node>
      </ul>
    </li>
    `
});

        // 确保即使出错也有基本的统计信息
        analysisdata.value = {
          function_count: 0,
          variable_count: 0,
          data_pointer_count: 0,
          function_pointer_count: 0,
          file_path: normalizedPath,
          total_count: 0
        };
      }
    };

    const refreshLayout = async () => {
      if (networkInstance.value) {
        networkInstance.value.stabilize(300);
        networkInstance.value.fit({
          animation: { duration: 500, easingFunction: 'easeInOutQuad' },
          padding: 50
        });
      }
    };

    // 加载以节点为中心的连通图（从搜索结果点击触发）
    const loadNodeGraph = async (nodeId, nodeLabel, nodeType, filePath) => {
      console.log('loadNodeGraph: 加载节点连通图', { nodeId, nodeLabel, nodeType, filePath });
      try {
        const response = await fetch(`/node_graph?node_id=${encodeURIComponent(nodeId)}&max_depth=3`);
        const data = await response.json();
        console.log('节点连通图数据:', { nodes: data.nodes?.length || 0, edges: data.edges?.length || 0 });

        if (!data.nodes || !data.edges || (data.nodes.length === 0 && data.edges.length === 0)) {
          console.warn('节点连通图数据为空');
          return;
        }

        // 确保数据集和网络实例已初始化
        if (!networkInstance.value) {
          console.warn('网络实例未初始化，延迟重试');
          setTimeout(() => loadNodeGraph(nodeId, nodeLabel, nodeType), 200);
          return;
        }

        // 更新文件信息面板和文件树选中路径
        currentFile.value = '';
        // 去掉 linux-6.6/ 前缀以匹配文件树格式
        selectedFilePath.value = (filePath || '').replace(/^linux-6\.6\//, '');
        analysisdata.value = {
          file_path: `节点连通图: ${nodeLabel} (${nodeType})`,
          function_count: data.nodes.filter(n => n.type === 'function').length,
          variable_count: data.nodes.filter(n => n.type === 'variable').length,
          data_pointer_count: data.nodes.filter(n => n.type === 'data_pointer').length,
          function_pointer_count: data.nodes.filter(n => n.type === 'function_pointer').length,
          read_access_count: data.edges.filter(e => e.access_type === 'read').length,
          write_access_count: data.edges.filter(e => e.access_type === 'write').length,
          total_count: data.nodes.length
        };

        // 保存原始数据
        originalNodes.value = data.nodes;
        originalEdges.value = data.edges;

        // 清除现有数据并加载新数据（nodes/edges 是 vis.DataSet，自动通知 network）
        nodes.value.clear();
        edges.value.clear();

        // 处理边并加载
        const processedEdges = processParallelEdges(data.edges);
        nodes.value.add(data.nodes);
        edges.value.add(processedEdges);

        // 重置过滤状态
        activeNodeId.value = null;
        isFiltered.value = false;

        // 强制可见并稳定布局
        cal_finished.value = false;
        showNetwork.value = true;
        networkInstance.value.setOptions({ physics: { enabled: true } });
        networkInstance.value.stabilize(300);

        // 稳定后适配视图
        setTimeout(() => {
          if (networkInstance.value) {
            networkInstance.value.fit({
              animation: { duration: 800, easingFunction: 'easeInOutQuad' },
              padding: 50
            });
          }
        }, 600);
      } catch (error) {
        console.error('加载节点连通图失败:', error);
      }
    };

    // 处理双击节点事件的主函数 - 使用参数传递避免作用域问题
    const handleNodeDoubleClick = async (nodeId, context) => {
      console.log('双击节点:', nodeId);
      
      try {
        // 如果当前节点已经是过滤状态，恢复完整图
        if (context.isFiltered.value && context.activeNodeId.value === nodeId) {
          console.log('恢复完整图');
          await restoreFullGraphWithContext(context);
        } else {
          console.log('过滤显示连通子图');
          await filterByConnectedSubgraphWithContext(nodeId, context);
        }
      } catch (error) {
        console.error('处理双击事件失败:', error);
      }
    };

    // 带上下文的恢复完整图函数
    const restoreFullGraphWithContext = async (context) => {
      if (context.originalNodes.value && context.originalEdges.value) {
        // 清除当前数据
        context.nodes.value.clear();
        context.edges.value.clear();
        
        // 恢复原始数据
        // 处理原始边数据，为相同两端的边添加不同的曲线参数
        const processedOriginalEdges = processParallelEdges(context.originalEdges.value);
        
        context.nodes.value.add(context.originalNodes.value);
        context.edges.value.add(processedOriginalEdges);
        
        // 重置状态
        context.activeNodeId.value = null;
        context.isFiltered.value = false;
        
        if (context.networkInstance.value) {
          // 重新应用布局
          context.networkInstance.value.stabilize(100);
          
          // 等待布局稳定后适应视图
          setTimeout(() => {
            context.networkInstance.value.fit({
              animation: {
                duration: 500,
                easingFunction: 'easeInOutQuad'
              }
            });
          }, 500);
        }
      }
    };

    // 带上下文的过滤连通子图函数
    const filterByConnectedSubgraphWithContext = async (nodeId, context) => {
      // 第一次过滤时保存原始数据
      if (!context.isFiltered.value) {
        context.originalNodes.value = context.nodes.value.get();
        context.originalEdges.value = context.edges.value.get();
        console.log('保存原始数据:', context.originalNodes.value.length, '个节点,', context.originalEdges.value.length, '个边');
      }
      
      // 在前端计算连通子图
      const connectedData = calculateConnectedSubgraphWithContext(nodeId, 3, context);
      
      console.log('计算到连通子图:', connectedData.nodes.length, '个节点,', connectedData.edges.length, '个边');
      
      // 更新图数据
      context.nodes.value.clear();
      context.edges.value.clear();
      
      // 处理连通子图的边数据，为相同两端的边添加不同的曲线参数
      const processedConnectedEdges = processParallelEdges(connectedData.edges);
      
      context.nodes.value.add(connectedData.nodes);
      context.edges.value.add(processedConnectedEdges);
      
      // 更新状态
      context.activeNodeId.value = nodeId;
      context.isFiltered.value = true;
      
      // 重新布局并聚焦到目标节点
      if (context.networkInstance.value) {
        context.networkInstance.value.stabilize(100);
        
        // 等待布局稳定后聚焦到目标节点
        setTimeout(() => {
          const position = context.networkInstance.value.getPosition(nodeId);
          if (position) {
            context.networkInstance.value.moveTo({
              position: position,
              scale: 1.0,
              animation: {
                duration: 500,
                easingFunction: 'easeInOutQuad'
              }
            });
          }
        }, 500);
      }
    };

    // 过滤显示连通子图 (保留原有函数用于其他地方调用)
    const filterByConnectedSubgraph = async (nodeId) => {
      const context = {
        isFiltered,
        activeNodeId,
        originalNodes,
        originalEdges,
        nodes,
        edges,
        currentFile,
        networkInstance
      };
      await filterByConnectedSubgraphWithContext(nodeId, context);
    };

    // 处理平行边，合并相同访问类型的边并为不同访问类型的边添加曲线参数
    const processParallelEdges = (edges) => {
      // 第一步：按照from-to-access_type分组，合并相同访问类型的边
      const accessTypeGroups = {};
      edges.forEach(edge => {
        const key = `${edge.from}_${edge.to}_${edge.access_type || edge.type}`;
        if (!accessTypeGroups[key]) {
          accessTypeGroups[key] = [];
        }
        accessTypeGroups[key].push(edge);
      });
      
      // 合并相同访问类型的边
      const mergedEdges = [];
      Object.values(accessTypeGroups).forEach(group => {
        if (group.length === 1) {
          // 单条边，直接使用
          mergedEdges.push(group[0]);
        } else {
          // 多条相同访问类型的边，合并为一条
          const firstEdge = group[0];
          const totalCount = group.reduce((sum, edge) => sum + (edge.access_count || 1), 0);
          const allLines = group.reduce((lines, edge) => {
            if (edge.access_lines) {
              return lines.concat(edge.access_lines);
            } else if (edge.line_number) {
              return lines.concat([edge.line_number]);
            }
            return lines;
          }, []);
          
          mergedEdges.push({
            ...firstEdge,
            access_count: totalCount,
            access_lines: allLines,
            label: firstEdge.access_type ? `${firstEdge.access_type} (${totalCount}次)` : firstEdge.label
          });
        }
      });
      
      // 第二步：按照from-to分组，为不同访问类型的边设置曲线参数
      const nodeGroups = {};
      mergedEdges.forEach(edge => {
        const key = `${edge.from}_${edge.to}`;
        if (!nodeGroups[key]) {
          nodeGroups[key] = [];
        }
        nodeGroups[key].push(edge);
      });
      
      // 为每组中的边设置不同的曲线参数
      const processedEdges = [];
      Object.values(nodeGroups).forEach(group => {
        if (group.length === 1) {
          // 单条边，使用直线
          processedEdges.push({
            ...group[0],
            smooth: { type: 'continuous' }
         
        })}  else {
          // 多条不同访问类型的边，使用不同的曲线偏移
          group.forEach((edge, index) => {
            const roundness = (index + 1) * 0.3; // 为每条边设置不同的曲线度
            processedEdges.push({
              ...edge,
              smooth: { 
                type: 'curvedCW',
                roundness: roundness
              }
            });
          });
        }
      });
      
      return processedEdges;
    };

    // 应用过滤
    const applyFilters = () => {
      // 确保数据集已初始化
      if (!nodes.value || !edges.value) {
        nodes.value = new vis.DataSet([]);
        edges.value = new vis.DataSet([]);
      }
      
      if (!originalNodes.value || !originalNodes.value.length) {
        return;
      }
      
      console.log('应用过滤设置:', filterSettings.value);
      
      // 过滤节点
      const filteredNodes = originalNodes.value.filter(node => {
        // 检查基本类型过滤
        if (filterSettings.value.nodes[node.type] === false) {
          return false;
        }
        
        // 检查外部节点过滤
        if (filterSettings.value.nodes.external === false) {
          // 如果外部节点被过滤掉，检查节点标签是否包含"(外部)"
          if (node.label && node.label.includes('(外部)')) {
            return false;
          }
        }
        
        return true;
      });
      
      // 过滤边
      const filteredEdges = originalEdges.value.filter(edge => {
        // 对于访问关系边，需要检查access_type字段
        if (edge.type === 'access') {
          return filterSettings.value.edges[edge.access_type] !== false;
        }
        // 对于其他类型的边，直接检查type字段
        return filterSettings.value.edges[edge.type] !== false;
      });
      
      console.log(`过滤结果: ${filteredNodes.length}/${originalNodes.value.length} 节点, ${filteredEdges.length}/${originalEdges.value.length} 边`);
      
      // 处理过滤后的边数据，为相同两端的边添加不同的曲线参数
      const processedFilteredEdges = processParallelEdges(filteredEdges);
      
      // 更新网络图
      if (networkInstance.value) {
        nodes.value.clear();
        edges.value.clear();
        nodes.value.add(filteredNodes);
        edges.value.add(processedFilteredEdges);
        networkInstance.value.stabilize(100);
      }
    };

    // 重置过滤
    const resetFilters = () => {
      initDataSets(); // 确保数据集已初始化
      
      filterSettings.value = {
        nodes: {
          function: true,
          variable: true,
          data_pointer: true,
          function_pointer: true,
          external: true  // 重置时外部节点默认选中
        },
        edges: {
          func_points_to: true,
          data_points_to: true,
          read: true,
          write: true
        }
      };
      applyFilters();
    };


    // 前端计算连通子图
    const calculateConnectedSubgraph = (startNodeId, maxDepth) => {
      const allNodes = originalNodes.value || nodes.value.get();
      const allEdges = originalEdges.value || edges.value.get();
      
      const visitedNodes = new Set();
      const visitedEdges = new Set();
      const queue = [{ nodeId: startNodeId, depth: 0 }];
      
      // 将起始节点加入结果
      visitedNodes.add(startNodeId);
      
      while (queue.length > 0) {
        const { nodeId, depth } = queue.shift();
        
        if (depth >= maxDepth) continue;
        
        // 找到所有与当前节点相连的边
        allEdges.forEach(edge => {
          if ((edge.from === nodeId || edge.to === nodeId) && !visitedEdges.has(edge.id)) {
            visitedEdges.add(edge.id);
            
            // 添加相连的节点
            const connectedNodeId = edge.from === nodeId ? edge.to : edge.from;
            if (!visitedNodes.has(connectedNodeId)) {
              visitedNodes.add(connectedNodeId);
              queue.push({ nodeId: connectedNodeId, depth: depth + 1 });
            }
          }
        });
      }
      
      // 构建结果
      const resultNodes = allNodes.filter(node => visitedNodes.has(node.id));
      const resultEdges = allEdges.filter(edge => visitedEdges.has(edge.id));
      
      return { nodes: resultNodes, edges: resultEdges };
    };

    // 带上下文的连通子图计算函数
    const calculateConnectedSubgraphWithContext = (startNodeId, maxDepth, context) => {
      const allNodes = context.originalNodes.value || context.nodes.value.get();
      const allEdges = context.originalEdges.value || context.edges.value.get();
      
      const visitedNodes = new Set();
      const visitedEdges = new Set();
      const queue = [{ nodeId: startNodeId, depth: 0 }];
      
      // 将起始节点加入结果
      visitedNodes.add(startNodeId);
      
      while (queue.length > 0) {
        const { nodeId, depth } = queue.shift();
        
        if (depth >= maxDepth) continue;
        
        // 找到所有与当前节点相连的边
        allEdges.forEach(edge => {
          if ((edge.from === nodeId || edge.to === nodeId) && !visitedEdges.has(edge.id)) {
            visitedEdges.add(edge.id);
            
            // 添加相连的节点
            const connectedNodeId = edge.from === nodeId ? edge.to : edge.from;
            if (!visitedNodes.has(connectedNodeId)) {
              visitedNodes.add(connectedNodeId);
              queue.push({ nodeId: connectedNodeId, depth: depth + 1 });
            }
          }
        });
      }
      
      // 构建结果
      const resultNodes = allNodes.filter(node => visitedNodes.has(node.id));
      const resultEdges = allEdges.filter(edge => visitedEdges.has(edge.id));
      
      return { nodes: resultNodes, edges: resultEdges };
    };


    onMounted(() => {
      // 初始化vis-network
      const container = document.getElementById('network');
      if (container) {
        // 初始化数据集
        if (!nodes.value || !edges.value) {
          nodes.value = new vis.DataSet([]);
          edges.value = new vis.DataSet([]);
        }
        
        const data = {
          nodes: nodes.value,
          edges: edges.value
        };

        const options = {
          physics: {
            enabled: true,
            solver: "forceAtlas2Based",
            forceAtlas2Based: {
              gravitationalConstant: -60,
              centralGravity: 0.01,
              springLength: 120,
              springConstant: 0.08,
              damping: 0.4
            },
            maxVelocity: 10,
            minVelocity: 0.1,
            stabilization: {
              enabled: true,
              iterations: 300,
              updateInterval: 25
            }
          },
          nodes: {
            shape: 'dot',
            size: 16,
            font: {
              size: 12,
              face: 'Arial'
            },
            borderWidth: 2,
            shadow: true,
            scaling: {
              min: 16,
              max: 16
            }
          },
          edges: {
            width: 2,
            shadow: true,
            font: {
              size: 10,
              face: 'Arial',
              color: '#333333',
              align: 'middle'
            },
            labelHighlightBold: false,
            selectionWidth: 3,
            hoverWidth: 3,
            arrows: {
              to: { enabled: false },
              from: { enabled: false }
            },
            // 使用动态曲线来避免相同两端的边重叠
            smooth: {
              type: 'dynamic'
            }
          },
          interaction: {
            hover: true,
            tooltipDelay: 200,
            dragNodes: false,  // 禁用节点拖动
            dragView: true,    // 允许拖动视图
            zoomView: true,    // 允许缩放视图
            zoomSpeed: 1.0,
            selectable: true,  // 允许选择节点
            selectConnectedEdges: false  // 选择节点时不高亮相连的边
          }
        };

        networkInstance.value = new vis.Network(container, data, options);

        
        // 添加节点双击事件监听 - 直接定义闭包函数
        networkInstance.value.on('doubleClick', async (params) => {
          if (!params.nodes || params.nodes.length === 0) return;
          const nodeId = params.nodes[0];
          
          console.log('双击节点:', nodeId);
          
          try {
            // 如果当前节点已经是过滤状态，恢复完整图
            if (isFiltered.value && activeNodeId.value === nodeId) {
              console.log('恢复完整图');
              
              if (originalNodes.value && originalEdges.value) {
                // 清除当前数据
                nodes.value.clear();
                edges.value.clear();
                
                // 恢复原始数据，处理边
                const processedOriginalEdges = processParallelEdges(originalEdges.value);
                
                nodes.value.add(originalNodes.value);
                edges.value.add(processedOriginalEdges);
                
                // 重置状态
                activeNodeId.value = null;
                isFiltered.value = false;
                
                if (networkInstance.value) {
                  networkInstance.value.stabilize(100);
                  setTimeout(() => {
                    networkInstance.value.fit({
                      animation: { duration: 500, easingFunction: 'easeInOutQuad' }
                    });
                  }, 500);
                }
              }
            } else {
              console.log('过滤显示连通子图');
              
              // 第一次过滤时保存原始数据
              if (!isFiltered.value) {
                originalNodes.value = nodes.value.get();
                originalEdges.value = edges.value.get();
                console.log('保存原始数据:', originalNodes.value.length, '个节点,', originalEdges.value.length, '个边');
              }
              
              // 在前端计算连通子图
              const connectedData = calculateConnectedSubgraph(nodeId, 3);
              
              console.log('计算到连通子图:', connectedData.nodes.length, '个节点,', connectedData.edges.length, '个边');
              
              // 更新图数据
              nodes.value.clear();
              edges.value.clear();
              
              // 处理连通子图的边数据
              const processedConnectedEdges = processParallelEdges(connectedData.edges);
              
              nodes.value.add(connectedData.nodes);
              edges.value.add(processedConnectedEdges);
              
              // 更新状态
              activeNodeId.value = nodeId;
              isFiltered.value = true;
              
              // 重新布局并聚焦到目标节点
              if (networkInstance.value) {
                networkInstance.value.stabilize(100);
                
                setTimeout(() => {
                  const position = networkInstance.value.getPosition(nodeId);
                  if (position) {
                    networkInstance.value.moveTo({
                      position: position,
                      scale: 1.0,
                      animation: { duration: 500, easingFunction: 'easeInOutQuad' }
                    });
                  }
                }, 500);
              }
            }
          } catch (error) {
            console.error('处理双击事件失败:', error);
          }
        });



        // 确保交互功能正常
        try {
          networkInstance.value.setOptions({
            interaction: { 
              dragNodes: false,  // 禁用节点拖动
              dragView: true,    // 允许拖动视图
              zoomView: true,    // 允许缩放视图
              zoomSpeed: 1.0,
              selectable: true,  // 允许选择节点
              selectConnectedEdges: false  // 选择节点时不高亮相连的边
            }
          });
        } catch {}

        // 事件监听
        networkInstance.value.on('hoverNode', function(params) {
          const nodeId = params.node;
          const nodeData = nodes.value.get(nodeId);
          // 简单的tooltip实现
          const tooltip = document.createElement('div');
          tooltip.className = 'network-tooltip';
          tooltip.innerHTML = `
            <div class="tooltip-header">
              <span class="node-type ${nodeData.type}">${nodeData.type}</span>
              <strong>${nodeData.label}</strong>
            </div>
            <div class="tooltip-section">
              <div>ID: ${nodeData.id}</div>
              ${nodeData.file_path ? `<div>File: ${nodeData.file_path}</div>` : ''}
            </div>
          `;
          
          const { clientX, clientY } = params.event;
          tooltip.style.left = `${clientX + 15}px`;
          tooltip.style.top = `${clientY + 15}px`;
          document.body.appendChild(tooltip);
          
          currentTooltip.value = tooltip;
        });

        networkInstance.value.on('blurNode', function(params) {
          if (currentTooltip.value) {
            currentTooltip.value.remove();
            currentTooltip.value = null;
          }
        });

        // 网络图事件监听
        networkInstance.value.on('startStabilizing', () => {
          // 只有在实际有数据时才显示加载状态
          if (nodes.value.length > 0) {
            cal_finished.value = false;
            showNetwork.value = false;
            console.log('网络图开始稳定化，隐藏图形');
          }
        });

        networkInstance.value.on('stabilizationIterationsDone', () => {
          // 只有在实际有数据时才更新状态
          if (nodes.value.length > 0) {
            cal_finished.value = true;
            showNetwork.value = true;
            console.log('网络图稳定化完成，显示图形。当前统计数据:', analysisdata.value);
            
            // 布局完成后关闭物理引擎，避免鼠标移动时图形变化
            networkInstance.value.setOptions({
              physics: { enabled: false }
            });
            console.log('物理引擎已关闭，图形布局稳定');
            
            // 自动适应视图，确保所有节点都可见
            setTimeout(() => {
              if (networkInstance.value && nodes.value.length > 0) {
                networkInstance.value.fit({
                  animation: { duration: 1000, easingFunction: 'easeInOutQuad' },
                  padding: 50
                });
                console.log('自动定位到节点区域完成');
              }
            }, 100);
          }
        });
      }
    });

    return {
      isTreeCollapsed,
      toggleTree,
      reloaddata,
      loadNodeGraph,
      refreshLayout,
      cal_finished,
      showNetwork,
      analysisdata,
      filterSettings,
      applyFilters,
      resetFilters,
      viewFileContent,
      closeFileContentModal,
      clearSelection,
      showFileContentModal,
      selectedFilePath,
      selectedFileName
    };
  },

// ==================== 搜索面板组件 ====================
const SearchPanel = defineComponent({
  name: 'SearchPanel',
  emits: ['function-selected', 'variable-selected', 'pointer-selected'],
  setup(props, { emit }) {
    const searchTerm = ref('');
    const results = ref([]);
    const selectedResult = ref(null);
    const detailResults = ref([]);
    const showTooltip = ref(false);
    const funcBody = ref('');
    let searchTimer = null;
    
    // 搜索过滤设置
    const searchFilters = ref({
      function: true,
      variable: true,
      data_pointer: true,
      function_pointer: true
    });
    
    console.log('初始过滤设置:', searchFilters.value);

    const handleSearchInput = () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        if (searchTerm.value.trim()) {
          // 构建查询参数，明确发送所有过滤参数
          const params = new URLSearchParams({
            name: searchTerm.value,
            include_functions: searchFilters.value.function.toString(),
            include_variables: searchFilters.value.variable.toString(),
            include_data_pointers: searchFilters.value.data_pointer.toString(),
            include_function_pointers: searchFilters.value.function_pointer.toString()
          });
          
          fetch(`/search_suggest?${params.toString()}`)
            .then(res => res.json())
            .then(data => {
              // 直接使用后端返回的数据，不需要前端过滤
              results.value = data;
            })
            .catch(error => {
              console.error('Search error:', error);
              results.value = [];
            });
        } else {
          results.value = [];
        }
      }, 300);
    };

    const loadDetailByIdOrName = (searchParam) => {
      showTooltip.value = true;
      fetch(`/search_detail?id=${encodeURIComponent(searchParam)}`)
        .then(async res => {
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          }
          const contentType = res.headers.get('content-type');
          if (!contentType || !contentType.includes('application/json')) {
            const text = await res.text();
            console.error('非JSON响应:', text.substring(0, 200));
            throw new Error('服务器返回非JSON响应');
          }
          return res.json();
        })
        .then(data => {
          if (data.error) {
            console.error('搜索详情API错误:', data.message);
            detailResults.value = [];
            alert(`搜索详情错误: ${data.message}`);
            return;
          }
          if (data.type && data.data) {
            const itemData = { ...data.data, type: data.type };
            detailResults.value = [itemData];
            if (data.type === 'function') {
              emit('function-selected', itemData);
            } else if (data.type === 'variable') {
              emit('variable-selected', itemData);
            } else if (data.type === 'data_pointer' || data.type === 'function_pointer') {
              emit('pointer-selected', itemData);
            }
          } else if (Array.isArray(data)) {
            detailResults.value = data;
          } else {
            detailResults.value = [];
            console.warn('未识别的数据格式:', data);
          }
          funcBody.value = null;
        })
        .catch(error => {
          console.error('=== 搜索详情错误 ===');
          console.error('错误详情:', error);
          console.error('错误堆栈:', error.stack);
          detailResults.value = [];
          alert(`搜索详情失败: ${error.message}`);
        });
    };

    const selectResult = (item) => {
      selectedResult.value = item;
      results.value = [];
      searchTerm.value = item.name;
      // 直接根据搜索结果中的类型触发事件，跳转关系图
      // 不依赖 search_detail API，避免404中断流程
      if (item.type === 'function') {
        emit('function-selected', { id: item.id, name: item.name, file_path: item.file_path });
      } else if (item.type === 'variable') {
        emit('variable-selected', { id: item.id, name: item.name, file_path: item.file_path });
      } else if (item.type === 'data_pointer' || item.type === 'function_pointer') {
        emit('pointer-selected', { id: item.id, name: item.name, type: item.type, file_path: item.file_path });
      }
      // 同时加载详细信息（用于搜索面板内展示，失败不影响关系图）
      loadDetailByIdOrName(item.id);
    };

    const openVariableDetail = (variableName) => {
      selectedResult.value = { id: variableName, name: variableName };
      results.value = [];
      searchTerm.value = variableName;
      loadDetailByIdOrName(variableName);
    };

    const openFunctionDetail = (functionName) => {
      selectedResult.value = { id: functionName, name: functionName };
      results.value = [];
      searchTerm.value = functionName;
      loadDetailByIdOrName(functionName);
    };

    const handleFunctionSelected = (funcId) => {
      emit('function-selected', funcId);
    };

    // 获取类型的中文显示名称
    const getTypeDisplayName = (type) => {
      const typeMap = {
        'function': '函数',
        'variable': '变量', 
        'data_pointer': '数据指针',
        'function_pointer': '函数指针'
      };
      return typeMap[type] || type || '未知类型';
    };

    // 获取类型徽章的CSS类
    const getTypeBadgeClass = (type) => {
      const classMap = {
        'function': 'type-function',
        'variable': 'type-variable',
        'data_pointer': 'type-data-pointer', 
        'function_pointer': 'type-function-pointer'
      };
      return classMap[type] || 'type-unknown';
    };

    // 手动加载函数体
    const loadFunctionBody = async (functionId) => {
      try {
        console.log('=== 加载函数体 ===');
        console.log('函数ID:', functionId);
        
        const response = await fetch(`/func_body?id=${functionId}`);
        const funcData = await response.json();
        
        console.log('函数体API返回:', funcData);
        
        if (funcData.error) {
          console.error('函数体API错误:', funcData.message);
          funcBody.value = `// 加载失败: ${funcData.message}`;
          return;
        }
        
        if (funcData.functions && funcData.functions.length > 0) {
          const func = funcData.functions[0];
          // 注意：API返回的字段是source_code，不是body
          const sourceCode = func.source_code || func.body || '';
          console.log('提取的源代码长度:', sourceCode.length);
          console.log('源代码前100字符:', sourceCode.substring(0, 100));
          
          funcBody.value = sourceCode;
        } else {
          console.warn('没有找到函数数据');
          funcBody.value = '// 没有找到函数源代码';
        }
        
        // 高亮代码
        await nextTick();
        if (window.hljs && document.querySelector('.func-body-section code')) {
          hljs.highlightElement(document.querySelector('.func-body-section code'));
        }
      } catch (error) {
        console.error('加载函数体失败:', error);
        funcBody.value = `// 加载函数体时出错: ${error.message}`;
      }
    };

    // 复制函数体到剪贴板
    const copyFunctionBody = async () => {
      try {
        await navigator.clipboard.writeText(funcBody.value);
        // 这里可以显示一个成功提示
        console.log('函数体已复制到剪贴板');
      } catch (error) {
        console.error('复制失败:', error);
      }
    };

    // 聚合访问关系 - 将同一函数对同一变量的多次同种访问合并
    const aggregateAccessRelations = (relations) => {
      const aggregated = {};
      
      relations.forEach(relation => {
        const key = `${relation.function_name || 'unknown'}_${relation.variable_name || 'unknown'}_${relation.access_type || 'unknown'}`;
        
        if (!aggregated[key]) {
          aggregated[key] = {
            function_name: relation.function_name,
            variable_name: relation.variable_name,
            access_type: relation.access_type,
            access_lines: [],
            access_files: new Set()
          };
        }
        
        if (relation.access_line) {
          aggregated[key].access_lines.push(relation.access_line);
        }
        if (relation.access_file) {
          aggregated[key].access_files.add(relation.access_file);
        }
      });
      
      // 转换为数组并排序行号
      return Object.values(aggregated).map(item => ({
        ...item,
        access_lines: item.access_lines.sort((a, b) => a - b),
        access_files: Array.from(item.access_files),
        line_count: item.access_lines.length
      }));
    };

    // 重置搜索过滤
    const resetSearchFilters = () => {
      searchFilters.value = {
        function: true,
        variable: true,
        data_pointer: true,
        function_pointer: true
      };
      // 重新搜索以应用重置的过滤
      if (searchTerm.value.trim()) {
        handleSearchInput();
      }
    };

    // 新增：过滤器变化处理函数
    const handleFilterChange = () => {
      // 如果有搜索词，立即重新搜索
      if (searchTerm.value.trim()) {
        handleSearchInput();
      }
    };

    const formatTooltipContent = (data) => {
      if (!data || data.length === 0) return '<p>无详细信息</p>';
      
      const item = data[0];
      let content = `
        <div class="tooltip-content">
          <h3>${item.name}</h3>
          <div class="tooltip-info">
            <p><strong>类型:</strong> ${item.type || '未知'}</p>
            <p><strong>文件:</strong> ${item.file_path || '未知'}</p>
      `;
      
      if (item.return_type) {
        content += `<p><strong>返回值:</strong> ${item.return_type}</p>`;
      }
      
      if (item.parameters) {
        content += `<p><strong>参数:</strong> ${item.parameters}</p>`;
      }
      
      if (item.start_line) {
        content += `<p><strong>行号:</strong> ${item.start_line}-${item.end_line}</p>`;
      }
      
      content += `
          </div>
        </div>
      `;
      
      return content;
    };

    const openFile = (filePath, fileName) => {
      try {
        // 事件向上传递，由父级页面统一处理文件内容展示
        const event = new CustomEvent('open-file', { detail: { filePath, fileName }, bubbles: true });
        const ok = document.dispatchEvent(event);
        if (!ok) console.warn('open-file 事件未被处理');
      } catch (e) {
        console.error('openFile 调用失败:', e);
      }
    };

    return {
      searchTerm,
      results,
      selectedResult,
      detailResults,
      showTooltip,
      funcBody,
      searchFilters,
      handleSearchInput,
      selectResult,
        loadDetailByIdOrName,
        openVariableDetail,
        openFunctionDetail,
      handleFunctionSelected,
      formatTooltipContent,
      getTypeDisplayName,
      getTypeBadgeClass,
      loadFunctionBody,
      copyFunctionBody,
      aggregateAccessRelations,
      resetSearchFilters,
      handleFilterChange,
      openFile
    };
  },
  template: `
    <div class="search-container">
      <!-- 搜索框 -->
      <div class="search-header">
        <div class="search-input-container">
          <input
            type="text"
            v-model="searchTerm"
            @input="handleSearchInput"
            placeholder="输入函数/变量名..."
            class="search-input"
          >
          <ul v-if="results.length" class="search-dropdown">
            <li v-for="item in results" :key="item.id" class="search-result-item">
              <div class="search-result-main" @click="selectResult(item)">
                <strong>{{ item.preview }}</strong>
              </div>
            </li>
          </ul>
        </div>
        <button class="search-btn" @click="handleSearchInput">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>

      <!-- 搜索过滤控制器 -->
      <div class="search-filters">
        <div class="filter-item">
          <input type="checkbox" id="search-filter-function" v-model="searchFilters.function" @change="handleFilterChange">
          <label for="search-filter-function">函数</label>
        </div>
        <div class="filter-item">
          <input type="checkbox" id="search-filter-variable" v-model="searchFilters.variable" @change="handleFilterChange">
          <label for="search-filter-variable">变量</label>
        </div>
        <div class="filter-item">
          <input type="checkbox" id="search-filter-data-pointer" v-model="searchFilters.data_pointer" @change="handleFilterChange">
          <label for="search-filter-data-pointer">数据指针</label>
        </div>
        <div class="filter-item">
          <input type="checkbox" id="search-filter-function-pointer" v-model="searchFilters.function_pointer" @change="handleFilterChange">
          <label for="search-filter-function-pointer">函数指针</label>
        </div>
      </div>

      <!-- 搜索结果和详情 -->
      <div class="search-content">
        <!-- 详细信息面板 -->
        <div class="detail-panel" v-if="selectedResult && detailResults.length > 0">
          <div class="detail-header">
            <h3>
              <span class="item-type-badge" :class="getTypeBadgeClass(detailResults[0].type)">
                {{ getTypeDisplayName(detailResults[0].type) }}
              </span>
              详细信息
            </h3>
            
          </div>
          <div class="detail-content">
            <div v-for="result in detailResults" :key="result.id" class="detail-section">
              <!-- 基本信息和特有信息合并 -->
              <div class="detail-unified-info">
                <!-- 基本信息 -->
                <div class="detail-item name-item" v-if="result.type !== 'data_pointer' && result.type !== 'function_pointer'">
                  <strong>名称:</strong> 
                  <span class="name-value">{{ result.name }}</span>
                </div>
                <div class="detail-item">
                  <strong>所在文件:</strong> {{ result.file_path }}
                  <button
                    v-if="result.file_path"
                    class="view-content-btn"
                    style="margin-left:6px"
                    title="查看文件内容"
                    @click.stop="openFile(result.file_path, result.name || '未知')"
                  >
                    <img src="../static/icons/eye.svg" alt="查看内容" width="16" height="16">
                  </button>
                </div>
                <div class="detail-item" v-if="result.start_line">
                  <strong>代码位置:</strong> 第{{ result.start_line }}行
                  <span v-if="result.end_line && result.end_line !== result.start_line">-{{ result.end_line }}行</span>
                </div>

                <!-- 函数特有信息 -->
                <template v-if="result.type === 'function'">
                  <div class="detail-item" v-if="result.return_type">
                    <strong>返回类型:</strong> 
                    <code class="return-type">{{ result.return_type }}</code>
                  </div>
                  <div class="detail-item" v-if="result.parameters">
                    <strong>参数列表:</strong>
                    <code class="parameters">{{ result.parameters }}</code>
                  </div>
                  <div class="detail-item" v-if="result.is_static !== undefined">
                    <strong>作用域:</strong> {{ result.is_static ? '静态函数' : '全局函数' }}
                  </div>
                </template>

                <!-- 变量特有信息 -->
                <template v-else-if="result.type === 'variable'">
                  <div class="detail-item" v-if="result.variable_type">
                    <strong>变量类型:</strong> 
                    <code class="variable-type">{{ result.variable_type }}</code>
                  </div>
                  <div class="detail-item" v-if="result.is_static !== undefined">
                    <strong>作用域:</strong> {{ result.is_static ? '静态变量' : '全局变量' }}
                  </div>
                </template>

                <!-- 指针特有信息 -->
                <template v-else-if="result.type === 'data_pointer' || result.type === 'function_pointer'">
                  <div class="detail-item" v-if="result.pointer_name">
                    <strong>指针名称:</strong> {{ result.pointer_name }}
                  </div>
                  <div class="detail-item" v-if="result.points_to_variable">
                    <strong>指向变量:</strong>
                    <span style="cursor: pointer" @click.stop="openVariableDetail(result.points_to_variable.name)">{{ result.points_to_variable.name }}</span>
                  </div>
                  <div class="detail-item" v-if="result.points_to_function">
                    <strong>指向函数:</strong>
                    <span style="cursor: pointer" @click.stop="openFunctionDetail(result.points_to_function.name)">{{ result.points_to_function.name }}</span>
                  </div>
                </template>
              </div>

              <!-- 访问关系信息 -->
              <div v-if="result.access_relations && result.access_relations.length > 0" class="detail-access-info">
                <h4>访问关系 ({{ result.access_relations.length }} 次访问，{{ aggregateAccessRelations(result.access_relations).length }} 个变量)</h4>
                <div class="access-relations-list">
                  <div v-for="relation in aggregateAccessRelations(result.access_relations)" :key="relation.function_name + '_' + relation.variable_name + '_' + relation.access_type" class="access-relation-item aggregated">
                    <div class="relation-main">
                      <span class="access-type" :class="relation.access_type">{{ relation.access_type === 'read' ? '读取' : '写入' }}</span>
                      <span class="variable-name">变量 
                        <strong style="cursor: pointer" @click.stop="openVariableDetail(relation.variable_name)">{{ relation.variable_name }}</strong>
                      </span>
                      <span v-if="relation.function_name" class="function-name">由函数 
                        <span style="cursor: pointer" @click.stop="openFunctionDetail(relation.function_name)">{{ relation.function_name }}</span>
